<title>Скинемся</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f3f3f7;--card:#ffffff;--ink:#16151c;--muted:#6c6b7a;--line:#e5e4ec;--field:#f6f6f9;
  --accent:#3b4bf5;--accent-ink:#ffffff;--soft:#e9ebff;
  --sun:#ffd43b;--coral:#ff7a59;--mint:#2bd4a4;--lilac:#b18cff;--sky:#4cc2ff;
  --owe:#e5484d;--get:#12a150;--get-soft:#ddf6e7;--owe-soft:#fde8e8;
  --sans:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --mono:"Manrope",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0e0e13;--card:#191920;--ink:#f2f2f6;--muted:#9b9aab;--line:#2a2a35;--field:#121218;
  --accent:#8b95ff;--accent-ink:#0e0e13;--soft:#23264a;--owe:#ff6b6e;--get:#3dd68c;--get-soft:#153323;--owe-soft:#3a1a1c}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0e0e13;--card:#191920;--ink:#f2f2f6;--muted:#9b9aab;--line:#2a2a35;--field:#121218;
  --accent:#8b95ff;--accent-ink:#0e0e13;--soft:#23264a;--owe:#ff6b6e;--get:#3dd68c;--get-soft:#153323;--owe-soft:#3a1a1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:500 16px/1.45 var(--sans);padding-inline:16px;padding-block:14px 48px;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;display:grid;gap:14px;background:var(--bg)}
.invalid{border-color:var(--owe)!important}

/* логотип */
.brand{display:grid;gap:6px;padding:6px 2px 4px}
.logo{display:flex;align-items:center;gap:12px}
.coins{display:flex;flex:none}
.coins i{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);display:block;margin-left:-11px}
.coins i:first-child{margin-left:0;background:var(--sun)}
.coins i:nth-child(2){background:var(--coral)}
.coins i:nth-child(3){background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:800 13px var(--display);font-style:normal}
.word{font:800 30px/1 var(--display);letter-spacing:-.03em;text-transform:lowercase}
.word em{font-style:normal;color:var(--accent)}
.tagline{color:var(--muted);font-size:15px;margin:0}

header.top{display:flex;align-items:center;gap:12px;min-height:48px}
header.top h1{font:800 22px/1.15 var(--display);letter-spacing:-.02em;margin:0;flex:1;text-wrap:balance;overflow-wrap:anywhere}
h1 .per{display:block;font:500 14px var(--sans);letter-spacing:0;color:var(--muted);margin-top:4px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:700 22px/1 var(--sans);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}

.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 var(--line)}
h2{font:700 13px var(--sans);color:var(--muted);margin:0 0 12px;letter-spacing:.01em}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--accent);background-color:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0;-webkit-appearance:none;appearance:none;opacity:1}
input:focus,select:focus,textarea:focus{background-color:var(--field);color:var(--ink);-webkit-text-fill-color:var(--ink);border-color:var(--accent);outline:none}
input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--field) inset;-webkit-text-fill-color:var(--ink)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=number]{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
input[type=date]{min-height:48px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:13px 20px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:48px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.small{padding:8px 14px;font-size:14px;min-height:36px}
.link{border:0;background:none;color:var(--muted);padding:6px;font-size:14px;font-weight:600}
.link.danger{color:var(--owe)}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 130px;gap:10px}
.form .three{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;margin:4px 2px}
.err{color:var(--owe);font-size:14px;margin:0}

/* вкладки */
.tabs{display:grid;grid-template-columns:1.15fr .8fr .75fr 1.15fr .8fr;background:var(--card);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 0 var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tabs button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:10px 0;font-size:13px;font-weight:700;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}

/* сводка мероприятия */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--accent);color:var(--accent-ink);box-shadow:none;position:relative;overflow:hidden}
.stats::after{content:"";position:absolute;right:-34px;bottom:-44px;width:96px;height:96px;border-radius:50%;background:var(--sun);opacity:.9}
.stats div{font-size:12px;font-weight:600;opacity:.85;position:relative;z-index:1}
.stats b{display:block;font:800 18px/1.3 var(--display);letter-spacing:-.02em;opacity:1;margin-top:4px;white-space:nowrap}

/* строки */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;font-weight:600}
.item .main small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:1px}
.item .main.edit{border:0;background:none;text-align:left;color:var(--ink);padding:0}
.item.editing{background:var(--soft);margin-inline:-16px;padding-inline:16px;border-radius:12px}
.arrow{color:var(--muted);font-weight:500}
.sum{font:800 15px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum.p{color:var(--get)} .sum.n{color:var(--owe)}

/* аватарки */
.ava{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:600 12px var(--display);color:#fff;text-transform:uppercase}
.ava.c0{background:var(--accent);color:var(--accent-ink)}.ava.c1{background:var(--coral)}.ava.c2{background:var(--sun);color:#16151c}
.ava.c3{background:var(--mint);color:#0e2a22}.ava.c4{background:var(--lilac)}.ava.c5{background:var(--sky);color:#0b2533}
.stack{display:flex;margin-top:8px}
.stack .ava{width:26px;height:26px;font-size:10px;margin-left:-7px;box-shadow:0 0 0 2px var(--card)}
.stack .ava:first-child{margin-left:0}
.stack .more{background:var(--line);color:var(--muted)}

/* список мероприятий */
.event{width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:16px;color:var(--ink);display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line)}
.event:active{transform:scale(.99)}
.event .main{flex:1;min-width:0}
.event b{font:800 17px/1.2 var(--display);letter-spacing:-.02em;display:block}
.event small{color:var(--muted);display:block;font-size:13px;margin-top:4px}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--get-soft);color:var(--get);white-space:nowrap}
.pill.warn{background:var(--owe-soft);color:var(--owe)}

/* чипы */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--field);border-radius:999px;padding:4px 4px 4px 4px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip .ava{width:26px;height:26px;font-size:10px}
.chip button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 8px 2px 0}
.split-head{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.split-head span{flex:1}
.pick{position:relative;cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.pick input:checked+span{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cat{color:var(--accent);font-weight:700}

.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}

.catrow{padding:7px 0}
.catline{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600}
.catline small{color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--field);margin-top:7px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.catrow:nth-child(6n+2) .bar i{background:var(--coral)}.catrow:nth-child(6n+3) .bar i{background:var(--sun)}
.catrow:nth-child(6n+4) .bar i{background:var(--mint)}.catrow:nth-child(6n+5) .bar i{background:var(--lilac)}.catrow:nth-child(6n) .bar i{background:var(--sky)}

.preview{white-space:pre-wrap;font:500 14px/1.55 var(--sans);background:var(--field);border-radius:14px;padding:14px;margin:12px 0 0;overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px var(--line)}
#imgBox{margin-top:12px;display:grid;gap:10px}
#imgBox img{width:100%;border-radius:14px;box-shadow:0 1px 0 var(--line)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf div{background:var(--field);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.pf span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.pf b{font:800 18px/1.3 var(--display);letter-spacing:-.02em}
.meter{height:10px;border-radius:5px;background:var(--field);margin:12px 0 8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;border-radius:5px;background:var(--get)}
.meter.bad i{background:var(--owe)}
.verdict{margin:0 0 4px;font-weight:700;padding:10px 12px;border-radius:14px}
.verdict.good{background:var(--get-soft);color:var(--get)}.verdict.bad{background:var(--owe-soft);color:var(--owe)}
.good{color:var(--get)}.bad{color:var(--owe)}
.pftable{margin-top:12px;display:grid;font-size:14px}
.pfrow{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr 1.1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pfrow:last-child{border-bottom:0}
.pfrow span{font-variant-numeric:tabular-nums;font-weight:600;overflow-wrap:anywhere}
.pfrow span:not(:first-child){text-align:right;font-weight:700}
.pfrow small{display:block;font-size:11px;font-weight:600;opacity:.85}
.pfrow.head span{font-size:12px;color:var(--muted);font-weight:700}
.pfrow.sub span{font-size:12px;color:var(--muted);font-weight:700;padding-top:6px}
.plan-edit{margin-top:12px}
.plan-edit summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.plan-edit .form{margin-top:10px}
.lbl{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.plancats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.desc-input{font:500 16px/1.45 var(--sans);min-height:0;resize:vertical}
.desc-add textarea{margin-top:8px}
.desc{padding:14px 16px}
.desc-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5}
.desc-text.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc .link{padding:6px 0 0;color:var(--accent)}
.event .desc-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.check input{width:22px;height:22px;padding:0;border-radius:7px;flex:none;accent-color:var(--accent);-webkit-appearance:checkbox;appearance:auto}
.item.muted .main,.item.muted .sum{opacity:.55}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.tag{white-space:nowrap;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.hint.ok{color:var(--get);font-weight:700;margin-top:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.more-cats{display:contents}
.more-btn{border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--soft)}
textarea{width:100%;font:13px ui-monospace,Menlo,monospace;border-radius:14px;padding:10px;min-height:120px}
</style>


<div class="app" id="app"></div>

<script>
const KEY="skinemsya.v1";
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){return {events:[]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.events))S=seed();
let view={event:null,tab:"exp"};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=k=>{const neg=k<0,a=Math.abs(k),r=Math.floor(a/100),c=a%100;const rs=String(r).replace(/\B(?=(\d{3})+(?!\d))/g," ");return (neg?"-":"")+rs+","+String(c).padStart(2,"0")};
const rub=k=>num(k)+" ₽";
// для чата: целые суммы без ",00"
const rubShort=k=>(Math.abs(k)%100?num(k):num(k).slice(0,-3))+" ₽";
const kop=v=>Math.round((parseFloat(String(v).replace(",","."))||0)*100);
const nameOf=(e,id)=>(e.people.find(p=>p.id===id)||{name:"—"}).name;

// на кого делится расход: список id или все участники
const CATS=[["food","Продукты"],["alco","Алкоголь"],["transport","Транспорт"],["home","Жильё"],["rest","Ресторан"],["banya","Баня"],["tour","Экскурсии"],["fun","Развлечения"],["group","Совместные закупки"],["school","Школа"],["clubs","Кружки и секции"],["extra","Допы"]];
const catName=k=>(CATS.find(c=>c[0]===k)||[,""])[1];
// суммы по категориям; без категории — отдельной строкой, если есть
function catTotals(e){const m={};e.expenses.forEach(x=>{const k=catName(x.cat)?x.cat:"";m[k]=(m[k]||0)+kop(x.amount)});
  const rows=CATS.filter(c=>m[c[0]]).map(c=>({k:c[0],n:c[1],a:m[c[0]]}));if(m[""])rows.push({k:"",n:"Без категории",a:m[""]});
  return {rows,any:CATS.some(c=>m[c[0]])}}
// кружок с первой буквой; цвет стабилен для имени
function ava(name,extra){const n=String(name||"?").trim();let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;
  return `<span class="ava c${h%6}${extra?" "+extra:""}" aria-hidden="true">${esc(n.charAt(0)||"?")}</span>`}
const pct=v=>(Math.round(v*10)/10).toString().replace(".",",")+"%";
function daysOf(e){if(!e.date)return 0;const a=new Date(e.date+"T00:00:00Z"),b=new Date((e.dateTo||e.date)+"T00:00:00Z");return Math.max(1,Math.round((b-a)/864e5)+1)}
function catFact(e){const m={};e.expenses.forEach(x=>{const k=catName(x.cat)?x.cat:"";m[k]=(m[k]||0)+kop(x.amount)});return m}
// разница план−факт: плюс = сэкономили
function planDelta(plan,fact){const d=plan-fact;return {d,p:plan?Math.abs(d)*100/plan:0,cls:d>=0?"good":"bad",word:d>=0?"Сэкономили":"Перерасход"}}
function wordsOf(n){return String(n||"").toLowerCase().split(/[^a-zа-яё]+/).filter(w=>w.length>=3).map(w=>w.slice(0,5))}
// похожие мероприятия: общие слова в названии, затем более свежие
function similarEvents(e){const w=new Set(wordsOf(e.name));
  return S.events.filter(x=>x.id!==e.id).map(x=>({x,score:wordsOf(x.name).filter(t=>w.has(t)).length}))
    .sort((a,b)=>b.score-a.score||(b.x.date||"").localeCompare(a.x.date||""))}
// основные категории на виду, остальные под «Ещё»
const MAIN_CATS=["","food","alco","transport","home","rest"];
function catChips(name,sel){
  const all=[["","Без категории"],...CATS],chip=([k,l])=>`<label class="pick"><input type="radio" name="${name}" value="${k}"${sel===k?" checked":""}><span>${l}</span></label>`;
  const main=all.filter(c=>MAIN_CATS.includes(c[0])),rest=all.filter(c=>!MAIN_CATS.includes(c[0]));
  const open=view.catsOpen||rest.some(c=>c[0]===sel);
  return `<div class="chips">${main.map(chip).join("")}<span class="more-cats" data-more="${name}"${open?"":" hidden"}>${rest.map(chip).join("")}</span><button type="button" class="more-btn" data-more-btn="${name}" aria-expanded="${open}">${open?"Свернуть":"Ещё +"+rest.length}</button></div>`;
}
function amongOf(e,x){const ids=e.people.map(p=>p.id);if(!Array.isArray(x.among))return ids;const f=x.among.filter(id=>ids.includes(id));return f.length?f:ids}
function amongLabel(e,x){const a=amongOf(e,x);if(a.length===e.people.length)return "на всех";
  const names=a.map(id=>nameOf(e,id));return `на ${a.length} из ${e.people.length}: `+(names.length>3?names.slice(0,3).join(", ")+"…":names.join(", "))}
function settle(e){
  const n=e.people.length,idx={};e.people.forEach((p,i)=>idx[p.id]=i);
  const bal=new Array(n).fill(0),paid=new Array(n).fill(0),owed=new Array(n).fill(0);let total=0;
  e.expenses.forEach(x=>{const a=kop(x.amount);const who=amongOf(e,x).map(id=>idx[id]),m=who.length;if(!m)return;
    total+=a;if(idx[x.payer]!==undefined)paid[idx[x.payer]]+=a;who.forEach(j=>owed[j]+=a/m)});
  // доли округляем до копеек один раз, остаток копеек отдаём самым большим дробным частям
  const fl=owed.map(v=>Math.floor(v+1e-9));let rem=total-fl.reduce((x,y)=>x+y,0);
  owed.map((v,i)=>({i,f:v-fl[i]})).sort((x,y)=>y.f-x.f||x.i-y.i).forEach(o=>{if(rem>0){fl[o.i]++;rem--}});
  for(let i=0;i<n;i++)bal[i]=paid[i]-fl[i];
  e.transfers.forEach(t=>{const a=kop(t.amount);if(idx[t.from]!==undefined&&idx[t.to]!==undefined){bal[idx[t.from]]+=a;bal[idx[t.to]]-=a}});
  const cr=[],db=[];bal.forEach((b,i)=>{if(b>0)cr.push({i,a:b});else if(b<0)db.push({i,a:-b})});
  cr.sort((a,b)=>b.a-a.a);db.sort((a,b)=>b.a-a.a);
  const plan=[];let c=0,d=0;
  while(c<cr.length&&d<db.length){const x=Math.min(cr[c].a,db[d].a);plan.push({from:e.people[db[d].i].id,to:e.people[cr[c].i].id,a:x});cr[c].a-=x;db[d].a-=x;if(!cr[c].a)c++;if(!db[d].a)d++}
  return {total,share:n?total/n:0,bal,plan,paid,owed:fl};
}

function render(){
  const root=document.getElementById("app");
  const e=S.events.find(x=>x.id===view.event);
  root.innerHTML=e?eventView(e):homeView();
  root.querySelectorAll("form").forEach(f=>f.noValidate=true);
  bind(e);
}

function homeView(){
  const f=S.filter||{mode:"all",from:"",to:""};
  const shown=filterEvents(S.events,f).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const sumAll=shown.reduce((t,e)=>t+settle(e).total,0);
  const list=shown.map(e=>{const s=settle(e);const left=s.plan.length;const per=periodRu(e);
    return `<button class="event" data-open="${e.id}"><span class="main"><b>${esc(e.name)}</b><small>${per?esc(per)+" · ":""}${rubShort(s.total)}</small>${e.desc?`<small class="desc-line">${esc(e.desc.split("\n")[0])}</small>`:""}${e.people.length?`<span class="stack">${e.people.slice(0,5).map(p=>ava(p.name)).join("")}${e.people.length>5?`<span class="ava more">+${e.people.length-5}</span>`:""}</span>`:""}</span>${left?`<span class="pill warn">${left} перев.</span>`:`<span class="pill">в расчёте</span>`}</button>`}).join("");
  const modes=[["all","Все"],["month","Этот месяц"],["prev","Прошлый месяц"],["year","Этот год"],["range","Период"]];
  const today=new Date().toISOString().slice(0,10);
  return `<header class="brand"><div class="logo" role="img" aria-label="Скинемся"><span class="coins"><i></i><i></i><i>₽</i></span><span class="word">скинем<em>ся</em></span></div><p class="tagline">Делим общие траты без неловких разговоров</p></header>
  <section class="card"><h2>Новая тусовка</h2><form class="form" id="newEvent">
    <input id="evName" placeholder="Название, например «Алтай, август»" required>
    <div class="dates"><label>с<input id="evFrom" type="date" value="${today}"></label><label>по<input id="evTo" type="date"></label></div>
    <p class="hint">Дата «по» нужна, если мероприятие длилось несколько дней.</p>
    <input id="evPeople" placeholder="Участники через запятую">
    <input id="evPlan" type="number" inputmode="decimal" min="0" step="1" placeholder="Бюджет, ₽ (необязательно)">
    <details class="plan-edit desc-add"><summary>Добавить описание</summary><textarea id="evDesc" class="desc-input" rows="3" maxlength="2000" placeholder="Место, маршрут, что взять с собой, договорённости"></textarea></details>
    <button class="btn">Погнали</button></form></section>
  ${S.events.length?`<section class="card"><h2>Показать</h2>
    <div class="chips">${modes.map(([k,l])=>`<label class="pick"><input type="radio" name="fmode" value="${k}"${f.mode===k?" checked":""}><span>${l}</span></label>`).join("")}</div>
    ${f.mode==="range"?`<div class="dates" style="margin-top:10px"><label>с<input id="fFrom" type="date" value="${esc(f.from)}"></label><label>по<input id="fTo" type="date" value="${esc(f.to)}"></label></div>`:""}
    <p class="hint" style="margin-top:10px">${f.mode==="all"?`Всего мероприятий: ${S.events.length}`:`Найдено ${shown.length} из ${S.events.length} · потрачено ${rubShort(sumAll)}`}</p></section>`:""}
  ${list||(S.events.length?'<p class="empty">За этот период мероприятий нет.</p>':'<p class="empty">Пока пусто. Создайте первое мероприятие: поездку, баню или день рождения.</p>')}
  <section class="card"><h2>Резервная копия</h2>
    <p class="empty" style="margin-top:0">Данные хранятся только на этом устройстве. Сохраните копию в «Файлы» или отправьте себе в мессенджер, чтобы не потерять их.${S.lastBackup?` Последняя копия: ${new Date(S.lastBackup).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}.`:""}</p>
    <div class="row-actions"><button class="btn" id="exportBtn">Сохранить копию</button><button class="btn ghost" id="importBtn">Загрузить из копии</button></div>
    <input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
    <div id="importAsk" class="form" style="margin-top:10px" hidden>
      <p class="empty" id="importInfo" style="margin:0"></p>
      <div class="row-actions"><button class="btn small" id="importMerge">Добавить к текущим</button><button class="btn ghost small" id="importReplace">Заменить всё</button><button class="link" id="importCancel">Отмена</button></div>
    </div>
    <p class="empty" id="backupMsg" hidden></p>
    <textarea id="backupText" readonly hidden></textarea>
  </section>`;
}

function eventView(e){
  const s=settle(e),t=view.tab;
  const opts=(sel)=>e.people.map(p=>`<option value="${p.id}"${p.id===sel?" selected":""}>${esc(p.name)}</option>`).join("");
  let body="";
  if(t==="exp"){
    const ed=e.expenses.find(x=>x.id===view.edit);const inSplit=ed?amongOf(e,ed):e.people.map(p=>p.id);
    body=`<section class="card" id="expCard"><h2>${ed?"Изменить расход":"Добавить расход"}</h2>${e.people.length?`<form class="form" id="addExp">
      <div class="two"><select id="expPayer" aria-label="Кто платил">${opts(ed&&ed.payer)}</select><input id="expAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Сумма" required value="${ed?esc(ed.amount):""}"></div>

const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
// «28 сентября 2026», «28–30 сентября 2026», «28 сентября – 2 октября 2026»
function periodRu(e){
  const a=e.date,b=e.dateTo&&e.dateTo!==e.date?e.dateTo:"";if(!a)return "";
  const [y1,m1,d1]=a.split("-").map(Number);if(!b)return `${d1} ${MONTHS[m1-1]} ${y1}`;
  const [y2,m2,d2]=b.split("-").map(Number);
  if(y1===y2&&m1===m2)return `${d1}–${d2} ${MONTHS[m1-1]} ${y1}`;
  if(y1===y2)return `${d1} ${MONTHS[m1-1]} – ${d2} ${MONTHS[m2-1]} ${y1}`;
  return `${d1} ${MONTHS[m1-1]} ${y1} – ${d2} ${MONTHS[m2-1]} ${y2}`;
}
// диапазон фильтра [from,to] в формате ГГГГ-ММ-ДД; пустая граница = без ограничения
function filterRange(f){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),iso=(Y,M,D)=>new Date(Date.UTC(Y,M,D)).toISOString().slice(0,10);
  if(f.mode==="month")return [iso(y,m,1),iso(y,m+1,0)];
  if(f.mode==="prev")return [iso(y,m-1,1),iso(y,m,0)];
  if(f.mode==="year")return [iso(y,0,1),iso(y,11,31)];
  if(f.mode==="range")return [f.from||"",f.to||""];
  return null;
}
function filterEvents(list,f){
  const r=filterRange(f);if(!r)return list.slice();
  const [from,to]=r;
  return list.filter(e=>{if(!e.date)return false;const s=e.date,t=e.dateTo&&e.dateTo>e.date?e.dateTo:e.date;
    return (!from||t>=from)&&(!to||s<=to)});
}
function dateRu(d){try{return d?new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}).replace(" г.",""):""}catch(err){return ""}}
const trWord=n=>n%10===1&&n%100!==11?"перевод":n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?"перевода":"переводов";
// переводы, сгруппированные по получателю
function groupsOf(e,s){const g=[];s.plan.forEach(p=>{let x=g.find(y=>y.to===p.to);if(!x){x={to:p.to,sum:0,rows:[]};g.push(x)}x.sum+=p.a;x.rows.push(p)});return g.sort((a,b)=>b.sum-a.sum)}
function planCard(e,s){
  const plan=kop(e.plan||0),pc=e.planCats||{},fact=s.total,cf=catFact(e),n=e.people.length;

  return `<section class="card" id="planCard"><h2>План и факт</h2>${top}

      <form class="form" id="planForm"><label class="lbl">Бюджет на всё мероприятие, ₽<input id="planTotal" type="number" inputmode="decimal" min="0" step="1" value="${esc(e.plan||"")}" placeholder="Например, 20000"></label>

      <div class="plancats">${CATS.map(([k,l])=>`<label class="lbl">${l}<input data-plancat="${k}" type="number" inputmode="decimal" min="0" step="1" value="${esc(pc[k]||"")}"></label>`).join("")}</div>
      <div class="row-actions"><button class="btn small">Сохранить план</button>${plan||catPlans.length?'<button type="button" class="link danger" id="planClear">Убрать план</button>':""}</div></form></details></section>`;

function compareCard(e,s){
  const sim=similarEvents(e);
  if(!sim.length)return `<section class="card"><h2>Сравнить с прошлым</h2><p class="hint">Сравнивать пока не с чем: нужно ещё хотя бы одно мероприятие.</p></section>`;
  let o=S.events.find(x=>x.id===e.compareWith&&x.id!==e.id);if(!o&&e.compareWith!=="none")o=sim[0].x;
  const opts=`<option value="none"${!o?" selected":""}>Не сравнивать</option>`+sim.map(({x,score})=>`<option value="${x.id}"${o&&o.id===x.id?" selected":""}>${esc(x.name)}${x.date?" · "+esc(periodRu(x)):""}${score?" ★":""}</option>`).join("");
  let table="";
  if(o){const so=settle(o),n1=e.people.length,n2=o.people.length,d1=daysOf(e),d2=daysOf(o);
    const row=(label,a,b,money,neutral)=>{const has=a!=null&&b!=null;let diff="";
      if(has){const d=a-b,pc=b?Math.abs(d)*100/b:0;const cls=neutral||!d?"":(d<0?"good":"bad");
        diff=`<span class="${cls}">${d>0?"+":d<0?"−":""}${money?rubShort(Math.abs(d)):Math.abs(d)}${b&&d?`<small>${pct(pc)}</small>`:""}</span>`}else diff="<span>—</span>";
      const f=v=>v==null?"—":money?rubShort(v):v;
      return `<div class="pfrow"><span>${label}</span><span>${f(a)}</span><span>${f(b)}</span>${diff}</div>`};
    const cf1=catFact(e),cf2=catFact(o);
    const cats=CATS.filter(c=>cf1[c[0]]||cf2[c[0]]).map(([k,l])=>row(l,cf1[k]||0,cf2[k]||0,true)).join("");
    table=`<div class="pftable cmp"><div class="pfrow head"><span></span><span>Сейчас</span><span>Тогда</span><span>Разница</span></div>
      ${row("Всего",s.total,so.total,true)}${row("Людей",n1,n2,false,true)}${row("Дней",d1||null,d2||null,false,true)}
      ${row("На человека",n1?Math.round(s.total/n1):null,n2?Math.round(so.total/n2):null,true)}
      ${d1&&d2&&n1&&n2?row("На чел. в день",Math.round(s.total/n1/d1),Math.round(so.total/n2/d2),true):""}
      ${cats?`<div class="pfrow sub"><span>По категориям</span></div>${cats}`:""}</div>
      <p class="hint">Зелёный: сейчас дешевле, красный: дороже. Проценты считаются от прошлого мероприятия.</p>`}
  return `<section class="card"><h2>Сравнить с прошлым</h2><select id="cmpSel" aria-label="С каким мероприятием сравнить">${opts}</select>
    ${sim[0].score?'<p class="hint" style="margin-top:6px">★ похожее по названию</p>':""}${table}</section>`;
}

  :'<p class="empty">Записей пока нет.</p>'}`;

function pushMine(e){
  const ready=(e.mine||[]).filter(x=>!x.pushed&&!x.personal);if(!ready.length||!e.me)return 0;
  const by={};ready.forEach(x=>{const k=catName(x.cat)?x.cat:"";(by[k]=by[k]||[]).push(x)});
  Object.entries(by).forEach(([k,list])=>{const sum=list.reduce((t,x)=>t+kop(x.amount),0);
    const notes=list.map(x=>x.note).filter(Boolean);
    const id=uid();e.expenses.push({id,payer:e.me,amount:(sum/100).toFixed(2),cat:k,note:notes.length?("Мои: "+notes.join(", ")).slice(0,140):`Мои записи (${list.length})`,among:null,fromMine:true});
    list.forEach(x=>{x.pushed=true;x.pushedTo=id})});
  return ready.reduce((t,x)=>t+kop(x.amount),0);
}
// вернуть перенесённые записи в журнал: убрать созданные из них строки общих расходов
function unpushMine(e){
  const pushed=(e.mine||[]).filter(x=>x.pushed);if(!pushed.length)return 0;
  const ids=new Set(pushed.map(x=>x.pushedTo).filter(Boolean));
  e.expenses=e.expenses.filter(x=>!ids.has(x.id));
  pushed.forEach(x=>{x.pushed=false;delete x.pushedTo});
  return pushed.reduce((t,x)=>t+kop(x.amount),0);
}
function summaryText(e){

  L.push(`Потрачено: ${rubShort(s.total)} · участников: ${e.people.length}`);
  const payers=e.people.map((p,i)=>({n:p.name,a:s.paid[i]})).filter(x=>x.a>0).sort((a,b)=>b.a-a.a);
  const plan=kop(e.plan||0);if(plan){const q=planDelta(plan,s.total);L.push(`Бюджет: ${rubShort(plan)} · ${q.word.toLowerCase()} ${rubShort(Math.abs(q.d))} (${pct(q.p)})`)}
  const ct=catTotals(e);if(ct.any){L.push("");L.push("На что:");ct.rows.forEach(r=>L.push(`• ${r.n}: ${rubShort(r.a)}`))}
  if(payers.length){L.push("");L.push("Платили:");payers.forEach(x=>L.push(`• ${x.n}: ${rubShort(x.a)}`))}
  L.push("");
  if(!s.plan.length){L.push("Все в расчёте.")}
  else groupsOf(e,s).forEach(g=>{L.push(`Получатель: ${nameOf(e,g.to)}, всего ${rubShort(g.sum)}`);g.rows.forEach(r=>L.push(`• ${nameOf(e,r.from)}: ${rubShort(r.a)}`));L.push("")});
  return L.join("\n").trim();
}

async function summaryImage(e,dark){
  try{await Promise.all(["800 60px Unbounded","600 24px Unbounded","500 30px Manrope","700 30px Manrope","800 30px Manrope"].map(f=>document.fonts.load(f,"Скинемся₽0")))}catch(err){}

  const C=dark?{bg:"#0e0e13",card:"#191920",ink:"#f2f2f6",muted:"#9b9aab",line:"#2a2a35",accent:"#8b95ff",head:"#2d3bd9",sun:"#ffd43b",track:"#23232d"}
    :{bg:"#f3f3f7",card:"#ffffff",ink:"#16151c",muted:"#6c6b7a",line:"#e5e4ec",accent:"#3b4bf5",head:"#3b4bf5",sun:"#ffd43b",track:"#f0f0f5"};
  const PAL=[["#3b4bf5","#fff"],["#ff7a59","#fff"],["#ffd43b","#16151c"],["#2bd4a4","#0e2a22"],["#b18cff","#fff"],["#4cc2ff","#0b2533"]];

  const ct=catTotals(e),catH=ct.any?96+ct.rows.length*64+28:0;
  const plan=kop(e.plan||0),planH=plan?230+28:0;
  const rowsH=groups.reduce((h,g)=>h+128+g.rows.length*72+28,0);
  const H=40+300+32+planH+catH+(s.plan.length?rowsH:150)+96;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  const rr=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
  const circle=(x,y,r,col)=>{c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=col;c.fill()};
  const fit=(t,max,font)=>{c.font=font;if(c.measureText(t).width<=max)return t;while(t.length>1&&c.measureText(t+"…").width>max)t=t.slice(0,-1);return t+"…"};
  const avaC=(name,x,y,r)=>{const n=String(name||"?").trim();let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;const [bg,fg]=PAL[h%6];
    circle(x,y,r,bg);c.fillStyle=fg;c.font=F(600,Math.round(r*.8),1);c.textAlign="center";c.textBaseline="middle";c.fillText(n.charAt(0).toUpperCase(),x,y+1);c.textAlign="left";c.textBaseline="alphabetic"};
  c.fillStyle=C.bg;c.fillRect(0,0,W,H);
  // шапка
  c.save();rr(40,40,W-80,300,36);c.clip();c.fillStyle=C.head;c.fillRect(40,40,W-80,300);
  circle(W-60,50,130,C.sun);circle(W-70,350,78,"#ff7a59");c.restore();
  // логотип
  circle(P+18,98,18,C.sun);circle(P+44,98,18,"#ff7a59");circle(P+70,98,18,"#ffffff");
  c.fillStyle="#3b4bf5";c.font=F(800,16,1);c.textAlign="center";c.textBaseline="middle";c.fillText("₽",P+70,99);c.textAlign="left";c.textBaseline="alphabetic";
  c.fillStyle="#fff";c.font=F(800,28,1);c.fillText("скинемся",P+104,108);
  c.fillStyle="rgba(255,255,255,.8)";c.font=F(600,26);c.fillText("Итог"+(e.date?" · "+periodRu(e):""),P,178);
  c.fillStyle="#fff";c.font=F(800,58,1);c.fillText(fit(e.name,W-2*P-120,F(800,58,1)),P,250);
  c.fillStyle="rgba(255,255,255,.92)";c.font=F(700,28);

  let y=372;
  const cardAt=(h)=>{c.fillStyle=C.card;rr(40,y,W-80,h,32);c.fill();};
  if(plan){
    const q=planDelta(plan,s.total),good=q.d>=0,col=good?(dark?"#3dd68c":"#12a150"):(dark?"#ff6b6e":"#e5484d"),soft=good?(dark?"#153323":"#ddf6e7"):(dark?"#3a1a1c":"#fde8e8");

    // вердикт справа
    const vt=`${q.word} ${rubShort(Math.abs(q.d))} · ${pct(q.p)}`;c.font=F(800,28);const vw=c.measureText(vt).width+44;
    c.fillStyle=soft;rr(W-P-vw,y+26,vw,52,26);c.fill();c.fillStyle=col;c.textAlign="right";c.fillText(vt,W-P-22,y+62);c.textAlign="left";
    // план и факт
    c.fillStyle=C.muted;c.font=F(600,24);c.fillText("План",P,y+118);c.fillText("Факт",P+300,y+118);
    c.fillStyle=C.ink;c.font=F(800,40,1);c.fillText(rubShort(plan),P,y+166);c.fillText(rubShort(s.total),P+300,y+166);
    // шкала
    c.fillStyle=C.track;rr(P,y+192,W-2*P,16,8);c.fill();
    c.fillStyle=col;rr(P,y+192,Math.max(16,(W-2*P)*Math.min(1,s.total/plan)),16,8);c.fill();
    y+=230+28}
  if(ct.any){
    const h=96+ct.rows.length*64,mx=Math.max(...ct.rows.map(r=>r.a));cardAt(h);
    c.fillStyle=C.muted;c.font=F(700,24);c.fillText("На что ушли деньги",P,y+58);

      c.fillStyle=C.track;rr(barX,ry+12,barW,18,9);c.fill();
      c.fillStyle=BAR[i%6];rr(barX,ry+12,Math.max(18,barW*r.a/mx),18,9);c.fill();
      c.textAlign="right";c.fillStyle=C.ink;c.font=F(800,30);c.fillText(rubShort(r.a),W-P-78,ry+32);

      ry+=64});
    y+=h+28}
  if(!s.plan.length){cardAt(122);c.fillStyle=C.accent;c.font=F(800,40,1);c.fillText("Все в расчёте",P,y+78);y+=150}
  groups.forEach(g=>{
    const h=128+g.rows.length*72;cardAt(h);
    avaC(nameOf(e,g.to),P+32,y+64,32);
    c.fillStyle=C.muted;c.font=F(700,22);c.fillText("ПОЛУЧАЕТ",P+84,y+48);
    c.fillStyle=C.ink;c.font=F(800,36,1);c.fillText(fit(nameOf(e,g.to),480,F(800,36,1)),P+84,y+94);
    // сумма в плашке
    c.font=F(800,34);const sw=c.measureText(rubShort(g.sum)).width+40;
    c.fillStyle=dark?"#23264a":"#e9ebff";rr(W-P-sw,y+38,sw,56,28);c.fill();
    c.fillStyle=C.accent;c.textAlign="right";c.fillText(rubShort(g.sum),W-P-20,y+78);c.textAlign="left";
    let ry=y+128;
    g.rows.forEach(r=>{
      c.fillStyle=C.line;c.fillRect(P,ry,W-2*P,2);
      avaC(nameOf(e,r.from),P+22,ry+36,22);
      c.fillStyle=C.ink;c.font=F(600,32);c.fillText(fit(nameOf(e,r.from),560,F(600,32)),P+62,ry+47);
      c.textAlign="right";c.font=F(800,32);c.fillText(rubShort(r.a),W-P,ry+47);c.textAlign="left";
      ry+=72});
    y+=h+28});
  c.fillStyle=C.muted;c.font=F(600,24);c.fillText("скинемся · посчитано "+new Date().toLocaleDateString("ru-RU"),P,H-50);
  return cv;
}
function bind(e){

    return;

  on("[data-tab]",ev=>{view.tab=ev.currentTarget.dataset.tab;view.edit=null;render()});

    let armed=false;$("delEv").onclick=()=>{if(!armed){armed=true;$("delConfirm").hidden=false;return}S.events=S.events.filter(x=>x.id!==e.id);view.event=null;commit()}}

    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Да, вернуть в журнал";$("mineBackHint").hidden=false;return}
    const sum=unpushMine(e);save();render();const m=document.getElementById("mineMsg");if(m&&sum){m.textContent=`Возвращено в журнал: ${rubShort(sum)}.`;m.hidden=false}};
  on("[data-del-mine]",ev=>{e.mine=(e.mine||[]).filter(x=>x.id!==ev.currentTarget.dataset.delMine);commit()});

  if($("planForm")){$("planForm").onsubmit=ev=>{ev.preventDefault();e.plan=$("planTotal").value||"";e.planCats={};
      document.querySelectorAll("[data-plancat]").forEach(i=>{if(kop(i.value)>0)e.planCats[i.dataset.plancat]=i.value});commit()};
    if($("planClear"))$("planClear").onclick=()=>{e.plan="";e.planCats={};commit()}}

  const makeImg=async dark=>{

    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));const fname=`itog-${(e.name||"raschet").replace(/[^\wа-яё-]+/gi,"_")}.png`;

    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(err){}
    if(dl&&blob){$("saveImg").hidden=false;$("saveImg").onclick=()=>dl.save({filename:fname,data:blob}).catch(()=>{})}
    $("imgBox").scrollIntoView({behavior:"smooth",block:"start"})};
  if($("makeImg")){$("makeImg").onclick=()=>makeImg(false);$("makeImgDark").onclick=()=>makeImg(true)}
  if($("copy"))$("copy").onclick=()=>{const txt=summaryText(e),ta=$("shareText");ta.value=txt;
    const fallback=()=>{ta.hidden=false;ta.focus();ta.select();$("copied").textContent="Выделите и скопируйте текст";$("copied").hidden=false};
    try{navigator.clipboard.writeText(txt).then(()=>{$("copied").textContent="Скопировано";$("copied").hidden=false},fallback)}catch(err){fallback()}};
}
// ---------- резервная копия ----------
const evWord=n=>n+" "+(n%10===1&&n%100!==11?"мероприятие":n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?"мероприятия":"мероприятий");
function validBackup(d){return d&&Array.isArray(d.events)&&d.events.every(e=>e&&e.id&&Array.isArray(e.people)&&Array.isArray(e.expenses)&&Array.isArray(e.transfers))}
function bindBackup($){
  const msg=t=>{$("backupMsg").textContent=t;$("backupMsg").hidden=false};
  const stamp=()=>{S.lastBackup=new Date().toISOString();save()};
  $("exportBtn").onclick=async()=>{
    const data=JSON.stringify({app:"skinemsya",version:1,saved:new Date().toISOString(),events:S.events},null,1);
    const fname=`skinemsya-${new Date().toISOString().slice(0,10)}.json`;
    // 1) страница внутри Claude
    try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
      if(dl){await dl.save({filename:fname,data});stamp();msg("Копия сохранена: "+fname);return}}catch(err){}
    // 2) меню «Поделиться» на телефоне: Файлы, Telegram, почта
    try{const file=new File([data],fname,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Скинемся: копия"});stamp();msg("Копия отправлена: "+fname);return}}
    catch(err){if(err&&err.name==="AbortError"){msg("Сохранение отменено.");return}}
    // 3) обычное скачивание
    try{const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);stamp();msg("Файл "+fname+" скачан. Если он не появился, скопируйте текст ниже и сохраните его в заметку.")}
    catch(err){msg("Не удалось сохранить файл. Скопируйте текст ниже и сохраните его в заметку.")}
    const ta=$("backupText");ta.value=data;ta.hidden=false;
  };
  let pending=null;
  $("importBtn").onclick=()=>{$("importFile").value="";$("importFile").click()};
  $("importFile").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(err){}
      if(!validBackup(d)){msg("Это не файл копии «Скинемся». Выберите файл skinemsya-….json.");return}
      pending=d;$("importInfo").textContent=`В копии ${evWord(d.events.length)}${d.saved?", сохранена "+new Date(d.saved).toLocaleString("ru-RU"):""}. Как загрузить?`;
      $("importAsk").hidden=false;$("backupMsg").hidden=true};
    r.readAsText(f)};
  $("importCancel").onclick=()=>{pending=null;$("importAsk").hidden=true};
  $("importMerge").onclick=()=>{if(!pending)return;let added=0,upd=0;
    pending.events.forEach(ne=>{const i=S.events.findIndex(x=>x.id===ne.id);if(i>=0){S.events[i]=ne;upd++}else{S.events.push(ne);added++}});
    save();render();msgAfter(`Загружено: новых ${added}, обновлено ${upd}.`)};
  $("importReplace").onclick=()=>{if(!pending)return;
    if($("importReplace").dataset.armed!=="1"){$("importReplace").dataset.armed="1";$("importReplace").textContent="Точно заменить? Нажмите ещё раз";return}
    S.events=pending.events;save();render();msgAfter(`Данные заменены: ${evWord(pending.events.length)}.`)};
}
function msgAfter(t){const m=document.getElementById("backupMsg");if(m){m.textContent=t;m.hidden=false}}
// своя проверка пустых полей вместо системной подсказки браузера
document.addEventListener("submit",ev=>{const bad=[...ev.target.querySelectorAll("[required]")].find(i=>!String(i.value).trim());
  if(bad){ev.preventDefault();ev.stopImmediatePropagation();bad.classList.add("invalid");bad.placeholder=bad.placeholder.replace(/^Заполните: /,"");bad.placeholder="Заполните: "+bad.placeholder;bad.focus()}},true);
document.addEventListener("input",ev=>{if(ev.target.classList)ev.target.classList.remove("invalid")});
