<title>Скинемся</title>

<style>
:root{
  --bg:#f3f3f7;--card:#ffffff;--ink:#16151c;--muted:#6c6b7a;--line:#e5e4ec;--field:#f6f6f9;
  --accent:#3b4bf5;--accent-ink:#ffffff;--soft:#e9ebff;
  --sun:#ffd43b;--coral:#ff7a59;--mint:#2bd4a4;--lilac:#b18cff;--sky:#4cc2ff;
  --owe:#bf2a30;--get:#0b7a3c;--get-soft:#ddf6e7;--owe-soft:#fde8e8;
  --sans:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --mono:"Manrope",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0e0e13;--card:#191920;--ink:#f2f2f6;--muted:#9b9aab;--line:#2a2a35;--field:#121218;
  --accent:#8b95ff;--accent-ink:#0e0e13;--soft:#23264a;--owe:#ff6b6e;--get:#3dd68c;--get-soft:#153323;--owe-soft:#3a1a1c}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0e0e13;--card:#191920;--ink:#f2f2f6;--muted:#9b9aab;--line:#2a2a35;--field:#121218;
  --accent:#8b95ff;--accent-ink:#0e0e13;--soft:#23264a;--owe:#ff6b6e;--get:#3dd68c;--get-soft:#153323;--owe-soft:#3a1a1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
body{color:var(--ink);font:500 16px/1.45 var(--sans);padding-inline:16px;padding-block:14px 48px;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:var(--bg)}
.app>*,.card>*,.form>*{min-width:0}
.invalid{border-color:var(--owe)!important}

/* логотип */
.brand{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:6px 2px 4px}
.brand>*{min-width:0}
.logo{display:flex;align-items:center;gap:12px}
.coins{display:flex;flex:none}
.coins i{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);display:block;margin-left:-11px}
.coins i:first-child{margin-left:0;background:var(--sun)}
.coins i:nth-child(2){background:var(--coral)}
.coins i:nth-child(3){background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:800 13px var(--display);font-style:normal}
.word{font:800 30px/1 var(--display);font-size:clamp(20px,6.4vw,30px);letter-spacing:-.03em;text-transform:lowercase;white-space:nowrap;min-width:0;overflow:hidden}
.word em{font-style:normal;color:var(--accent)}
.tagline{color:var(--muted);font-size:15px;margin:0}

header.top{display:flex;align-items:center;gap:12px;min-height:48px}
header.top h1{font:800 22px/1.15 var(--display);letter-spacing:-.02em;margin:0;flex:1;text-wrap:balance;overflow-wrap:anywhere}
h1 .per{display:block;font:500 14px var(--sans);letter-spacing:0;color:var(--muted);margin-top:4px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:700 22px/1 var(--sans);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}

.card{scroll-margin-top:64px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 var(--line)}
h2{font:700 13px var(--sans);color:var(--muted);margin:0 0 12px;letter-spacing:.01em}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--accent);background-color:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0;-webkit-appearance:none;appearance:none;opacity:1}
input:focus,select:focus,textarea:focus{background-color:var(--field);color:var(--ink);-webkit-text-fill-color:var(--ink);border-color:var(--accent);outline:none}
input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--field) inset;-webkit-text-fill-color:var(--ink)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=number],input.amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
input[type=date]{min-height:48px;padding:10px 8px 10px 12px;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-align:left}
input[type=date]::-webkit-datetime-edit,input[type=date]::-webkit-datetime-edit-fields-wrapper{padding:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0 0 0 2px;padding:0;width:16px;height:16px;opacity:.6}
input[type=date]::-webkit-date-and-time-value{text-align:left}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:13px 20px;background:var(--sun);color:#16151c;font-weight:800;min-height:48px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.form>.btn,.form>.row-actions>.btn:first-child{width:100%}
.form>.row-actions>.btn:first-child{flex:1}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.small{padding:8px 14px;font-size:14px;min-height:36px}
.link{border:0;background:none;color:var(--muted);padding:6px;font-size:14px;font-weight:600}
.link.danger{color:var(--owe)}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 130px;gap:10px}
.form .three{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;margin:4px 2px}
.err{color:var(--owe);font-size:14px;margin:0}

/* вкладки */
.tabs{display:grid;grid-template-columns:1.15fr .8fr .75fr 1.15fr .8fr;background:var(--card);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 0 var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tabs button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:10px 0;font-size:13px;font-weight:700;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tabs button.tab-mine{color:var(--accent);background:var(--soft)}
.tabs button.tab-mine[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.tabs button.tab-sum{background:var(--sun);color:#16151c;font-weight:800;margin-left:2px}
.tabs button.tab-sum[aria-selected=true]{background:var(--sun);color:#16151c;box-shadow:inset 0 0 0 2.5px var(--ink)}

/* сводка мероприятия */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;background:var(--accent);color:var(--accent-ink);box-shadow:none;position:relative;overflow:hidden}
.stats::after{content:"";position:absolute;right:-34px;bottom:-44px;width:96px;height:96px;border-radius:50%;background:var(--sun);opacity:.9}
.stats div{font-size:12px;font-weight:600;opacity:.85;position:relative;z-index:1}
.stats div{min-width:0}
.stats b{display:block;font:800 18px/1.3 var(--display);font-size:clamp(13px,4.5vw,18px);letter-spacing:-.02em;opacity:1;margin-top:4px;white-space:nowrap}

/* строки */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;font-weight:600}
.item .main small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:1px}
.item .main.edit{border:0;background:none;text-align:left;color:var(--ink);padding:0}
.item.editing{background:var(--soft);margin-inline:-16px;padding-inline:16px;border-radius:12px}
.arrow{color:var(--muted);font-weight:500}
.sum{font:800 15px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum.p{color:var(--get)} .sum.n{color:var(--owe)}

/* аватарки */
.ava{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:600 12px var(--display);color:#fff;text-transform:uppercase}
.ava.c0{background:var(--accent);color:var(--accent-ink)}.ava.c1{background:var(--coral)}.ava.c2{background:var(--sun);color:#16151c}
.ava.c3{background:var(--mint);color:#0e2a22}.ava.c4{background:var(--lilac)}.ava.c5{background:var(--sky);color:#0b2533}
.stack{display:flex;margin-top:8px}
.stack .ava{width:26px;height:26px;font-size:10px;margin-left:-7px;box-shadow:0 0 0 2px var(--card)}
.stack .ava:first-child{margin-left:0}
.stack .more{background:var(--line);color:var(--muted)}

/* список мероприятий */
.event{width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:16px;color:var(--ink);display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line)}
.event:active{transform:scale(.99)}
.ev-wrap{position:relative}
.ev-wrap .event{align-items:flex-start;min-height:104px}
.ev-del{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;border:0;padding:0;background:var(--owe-soft);color:var(--owe);display:grid;place-items:center}
.ev-del:active{transform:scale(.92)}
.event .main{flex:1;min-width:0}
.event b{font:800 17px/1.2 var(--display);letter-spacing:-.02em;display:block}
.event small{color:var(--muted);display:block;font-size:13px;margin-top:4px}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--get-soft);color:var(--get);white-space:nowrap}
.pill.warn{background:var(--owe-soft);color:var(--owe)}

/* чипы */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--field);border-radius:999px;padding:4px 4px 4px 4px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip .ava{width:26px;height:26px;font-size:10px}
.chip button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 8px 2px 0}
.split-head{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.split-head span{flex:1}
.pick{position:relative;cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.pick input:checked+span{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.pick input:checked+span::before{content:"✓ ";font-weight:800}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cat{color:var(--accent);font-weight:700}

.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
@media (max-width:350px){.dates{grid-template-columns:1fr}}

.catrow{padding:7px 0}
.catline{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600}
.catline small{color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--field);margin-top:7px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.catrow:nth-child(6n+2) .bar i{background:var(--coral)}.catrow:nth-child(6n+3) .bar i{background:var(--sun)}
.catrow:nth-child(6n+4) .bar i{background:var(--mint)}.catrow:nth-child(6n+5) .bar i{background:var(--lilac)}.catrow:nth-child(6n) .bar i{background:var(--sky)}

.preview{white-space:pre-wrap;font:500 14px/1.55 var(--sans);background:var(--field);border-radius:14px;padding:14px;margin:12px 0 0;overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px var(--line)}
#imgBox{margin-top:12px;display:grid;gap:10px}
#imgBox img{width:100%;border-radius:14px;box-shadow:0 1px 0 var(--line)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf div{min-width:0;background:var(--field);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.pf span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.pf b{font:800 18px/1.3 var(--display);font-size:clamp(13px,4.4vw,18px);letter-spacing:-.02em;white-space:nowrap}
.meter{height:10px;border-radius:5px;background:var(--field);margin:12px 0 8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;border-radius:5px;background:var(--get)}
.meter.bad i{background:var(--owe)}
.verdict{margin:0 0 4px;font-weight:700;padding:10px 12px;border-radius:14px}
.verdict.good{background:var(--get-soft);color:var(--get)}.verdict.bad{background:var(--owe-soft);color:var(--owe)}
.good{color:var(--get)}.bad{color:var(--owe)}
.pftable{margin-top:12px;display:grid;font-size:14px}
.pfrow{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr 1.1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pfrow:last-child{border-bottom:0}
.pfrow span{font-variant-numeric:tabular-nums;font-weight:600;overflow-wrap:anywhere;min-width:0}
.pfrow span:not(:first-child){text-align:right;font-weight:700}
.pfrow small{display:block;font-size:11px;font-weight:600;opacity:.85}
.pfrow.head span{font-size:12px;color:var(--muted);font-weight:700}
.pfrow.sub span{font-size:12px;color:var(--muted);font-weight:700;padding-top:6px}
.plan-edit{margin-top:12px}
.plan-edit summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.plan-edit .form{margin-top:10px}
.lbl{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.plancats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.desc-input{font:500 16px/1.45 var(--sans);min-height:0;resize:vertical}
.desc-add textarea{margin-top:8px}
.desc{padding:14px 16px}
.desc-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5}
.desc-text.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc .link{padding:6px 0 0;color:var(--accent)}
.event .desc-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.check input{width:22px;height:22px;padding:0;border-radius:7px;flex:none;accent-color:var(--accent);-webkit-appearance:checkbox;appearance:auto}
.item.muted .main,.item.muted .sum{opacity:.55}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.tag{white-space:nowrap;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.hint.ok{color:var(--get);font-weight:700;margin-top:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toc-chip{border:0;border-radius:999px;padding:8px 12px;min-height:36px;background:var(--soft);color:var(--accent);font:700 13px var(--sans)}
.help-sec summary span small{display:block;font:600 13px/1.35 var(--sans);color:var(--muted);letter-spacing:0;margin-top:3px}
.shot{margin:4px 0 12px;padding:0}
.shot img{display:block;width:100%;max-width:320px;height:auto;margin:0 auto;border-radius:16px;box-shadow:0 0 0 1px var(--line),0 8px 24px -14px rgba(0,0,0,.4);background:var(--field)}
.shot figcaption{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
.hsteps{list-style:none;counter-reset:hs;margin:0 0 12px;padding:0;display:grid;gap:10px}
.hsteps li{counter-increment:hs;position:relative;padding-left:36px;line-height:1.5}
.hsteps li::before{content:counter(hs);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:#ff7a59;color:#fff;font:800 14px/26px var(--sans);text-align:center}
.ex.tip .ex-tag{background:var(--mint);color:#0e2a22}
.fmode-btn svg{flex:none;color:var(--accent)}
.fmode-btn .pk-label{font-weight:700}
.search-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding:0 6px 0 12px;background:var(--field);border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.search-row:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.search-row input{border:0;background:transparent;padding:12px 0;flex:1;min-width:0;box-shadow:none}
.search-row input:focus{border:0;background:transparent}
.search-row input::-webkit-search-cancel-button{display:none}
.search-row .link{min-width:40px;min-height:40px;font-size:22px;padding:0}
.q-pick{width:100%;margin-top:8px}
/* длинные слова без пробелов (ссылки, номера) переносятся и не раздвигают экран */
#app,#app *,.sheet,.sheet *,#toast{overflow-wrap:anywhere}
.chip{max-width:100%}.chip-main{min-width:0}.chip-main>span{min-width:0}
.event .main b,.item .main,.pk-label,.del-info b{min-width:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;margin:0 auto;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--line)}
@supports not (color:color-mix(in srgb,red,blue)){.bnav{background:var(--card)}}
.bnav button{position:relative;border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:6px 0 4px;min-height:52px;border-radius:14px;font:700 11px/1.2 var(--sans)}
.bnav button svg{display:block}
.bnav button[aria-selected=true]{color:var(--accent);background:var(--soft)}
.bnav .bdg{position:absolute;top:3px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--owe);color:#fff;font:800 11px/18px var(--sans);font-style:normal}
body.has-bnav{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.has-bnav #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:41;width:60px;height:60px;border-radius:50%;border:0;background:var(--sun);color:#16151c;display:grid;place-items:center;box-shadow:0 8px 22px -6px rgba(0,0,0,.35)}
.fab:active{transform:scale(.94)}
.form-sheet{z-index:45}
.form-sheet .sheet{max-height:92vh;max-height:92dvh}
.form-sheet .sheet-list{display:block;padding:0 2px}
.form-sheet .form-foot{position:sticky;bottom:0;background:var(--card);padding:10px 0 4px;margin-top:4px}
.form-sheet .form-foot .btn:first-child{flex:1}
.amt-big{font-size:24px!important;padding:14px 16px}
#expCard .form>*{min-width:0}
.item .link.danger{min-width:44px;min-height:44px;display:grid;place-items:center;font-size:20px;margin-right:-10px;padding:0}
.chip button[data-del-p]{min-width:36px;min-height:36px;padding:0 6px 0 0;font-size:20px}
.hist-btn{min-height:36px;padding:8px 12px}
.plan-edit summary{min-height:40px;display:flex;align-items:center}
.stats-card summary{min-height:44px}
#multiToggle,.tpl-link,.link.acc{min-height:40px}
.new-btn{width:100%;min-height:56px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#3b4bf5,#7a3fe0);color:#fff;box-shadow:0 10px 24px -12px rgba(59,75,245,.7)}
.new-btn span{font:800 24px/1 var(--display)}
.party-close{color:#ffe27a}
.chips-scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .pick{flex:none}
.ana>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;min-height:44px}
.ana>summary::-webkit-details-marker{display:none}
.ana>summary span{font:800 16px/1.3 var(--display);letter-spacing:-.01em}
.ana>summary small{grid-column:1;color:var(--muted);font-size:13px;font-weight:600}
.ana>summary .cat-chev{grid-row:1/3;grid-column:2;margin:0}
.ana[open]>summary .cat-chev{transform:rotate(45deg)}
.ana-body>.card{background:transparent;box-shadow:none;border-radius:0;padding:14px 0 4px;border-top:1px solid var(--line);margin-top:12px}
.ana-body>.card.pp{padding-bottom:10px}
.title-edit{border:0;background:none;padding:0;margin:0;color:inherit;font:inherit;letter-spacing:inherit;text-align:left;cursor:pointer;width:100%;overflow-wrap:anywhere}
.title-edit .per{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.edit-hint{display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-weight:700;font-size:13px}
.sheet-act .sh-check{display:none}
.sheet-act .sh-ico{background:var(--soft);color:var(--accent)}
.share-main{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.cmp-verdict{display:grid;gap:4px;margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;line-height:1.4}
.cmp-verdict b{font-size:16px;font-weight:800}
.cmp-verdict.good{background:var(--get-soft);box-shadow:none}.cmp-verdict.good b{color:var(--get)}
.cmp-verdict.bad{background:var(--owe-soft);box-shadow:none}.cmp-verdict.bad b{color:var(--owe)}
.cmp-verdict span{color:var(--ink);opacity:.85}
.pick-sum{display:flex;align-items:baseline;gap:10px;margin-top:10px;font-size:14px;font-weight:600}
.pick-sum span{flex:1;min-width:0;overflow-wrap:anywhere}
.pick-sum .link{flex:none}
.tr-row{padding:10px 0;border-bottom:1px solid var(--line)}.tr-row:last-of-type{border-bottom:0}
.tr-row .item{padding:0;border:0}
.tr-acts{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.tr-acts .btn.small{padding:8px 6px;font-size:13px;width:100%}
.pay-line{color:var(--get);font-weight:600;overflow-wrap:anywhere}
.round-chips{margin:0 0 6px}
.nag{background:var(--owe-soft);box-shadow:none;display:grid;gap:6px}
.nag b{color:var(--owe);font-weight:800}
.nag .hint{color:var(--ink);opacity:.8}
.stats-card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font:800 16px/1.3 var(--display);letter-spacing:-.01em}
.stats-card summary::-webkit-details-marker{display:none}
.stats-card summary span{flex:1}
.stats-card[open] summary .cat-chev{transform:rotate(45deg)}
.stats-card summary .cat-chev{margin:0}
.st-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.st-row:last-of-type{border-bottom:0}
.st-row .main{flex:1;min-width:0}
.st-row .main b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .main small{color:var(--muted);font-size:12px}
.st-row .sum{text-align:right}.st-row .sum small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.st-bars{display:grid;gap:3px;margin-top:5px}
.st-bars i{display:block;height:5px;border-radius:3px;min-width:2px}
.st-bars .pd{background:var(--accent)}.st-bars .pt{background:var(--sun)}
.two.multi-on{grid-template-columns:1fr}.two.multi-on .picker{display:none}
input[readonly]{opacity:.75}
.chip-main{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:inherit;font:inherit;padding:0;text-align:left}
.pay-tag{color:var(--get);background:var(--get-soft);box-shadow:none}
.tpl-link{color:var(--accent);padding:2px 0;justify-self:start;text-align:left}
.party .tpl-link{color:#ffe27a}
.tpl-note .tpl-link{display:inline;padding:0 0 0 4px}
.more-cats{display:contents}
.more-btn{border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--soft)}
.brand-row{display:flex;align-items:center;gap:8px}

const KEY="skinemsya.v1";

// сохранение; если браузер не дал сохранить (память заполнена, приватный режим) — предупреждаем

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// для чата: целые суммы без ",00"
const rubShort=k=>(Math.abs(k)%100?num(k):num(k).slice(0,-3))+"\u00a0₽";
const kop=v=>Math.round((parseFloat(String(v??"").replace(/[\s\u00a0]/g,"").replace(",","."))||0)*100);

// на кого делится расход: список id или все участники
const CATS=[["food","Продукты"],["alco","Алкоголь"],["transport","Транспорт"],["home","Жильё"],["rest","Ресторан"],["banya","Баня"],["tour","Экскурсии"],["fun","Развлечения"],["group","Совместные закупки"],["extra","Допы"]];

function catsOf(x){const a=Array.isArray(x.cats)?x.cats:(x.cat?[x.cat]:[]);return [...new Set(a.filter(k=>catName(k)))]}

function catSplit(x){const a=kop(x.amount),ks=catsOf(x);if(!ks.length)return {"":a};if(ks.length===1)return {[ks[0]]:a};
  const m=x.catAmounts;if(m&&ks.every(k=>m[k]!=null)){const v=ks.map(k=>kop(m[k]));if(v.reduce((t,y)=>t+y,0)===a){const o={};ks.forEach((k,i)=>o[k]=v[i]);return o}}

// кружок с первой буквой; цвет стабилен для имени
function ava(name,extra){const n=String(name||"?").trim();let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;

    <label class="lbl liked"><span class="lbl-ico"><span class="thumb">${THUMB_DOWN}</span>Что не понравилось?</span><textarea id="dislikedInput" class="desc-input" rows="3" maxlength="500" placeholder="Необязательно. Например: долго ехали, мало дров, дорогой ужин">${esc(e.disliked||"")}</textarea></label>
    <p class="hint ok" id="likedSaved" hidden>Сохранено</p></section>`}
function amongOf(e,x){const ids=e.people.map(p=>p.id);if(!Array.isArray(x.among))return ids;const f=x.among.filter(id=>ids.includes(id));return f.length?f:ids}
function amongLabel(e,x){const a=amongOf(e,x);if(a.length===e.people.length)return "на всех";
  const names=a.map(id=>nameOf(e,id));return `на ${a.length} из ${e.people.length}: `+(names.length>3?names.slice(0,3).join(", ")+"…":names.join(", "))}
// доли участников: пара = 2, ребёнок = 0,5
const W_OPTS=[0.5,1,1.5,2,3,4,5];
const wOf=p=>p&&p.w>0?p.w:1;
const wLabel=w=>String(w).replace(".",",");
const hasWeights=e=>e.people.some(p=>wOf(p)!==1);
// кто платил за расход: [{id,a}] в копейках; несколько плательщиков, только если их суммы сходятся с общей
function payersOf(e,x){const a=kop(x.amount);
  if(Array.isArray(x.payers)&&x.payers.length>1){const ids=new Set(e.people.map(p=>p.id));
    const v=x.payers.filter(p=>p&&ids.has(p.id)).map(p=>({id:p.id,a:kop(p.amount)})).filter(p=>p.a>0);
    if(v.length>1&&v.reduce((t,p)=>t+p.a,0)===a)return v}
  return [{id:x.payer,a}]}
const payersLabel=(e,x)=>payersOf(e,x).map(p=>nameOf(e,p.id)).join(" + ");
// округление переводов: 0, 10 или 100 ₽ (в копейках); допуск «рассчитался» — половина шага
const roundStep=e=>e&&(e.round===10||e.round===100)?e.round*100:0;
const tolOf=e=>roundStep(e)?roundStep(e)/2:1;
function settle(e){
  const n=e.people.length,idx={};e.people.forEach((p,i)=>idx[p.id]=i);
  const bal=new Array(n).fill(0),paid=new Array(n).fill(0),owed=new Array(n).fill(0);let total=0;
  e.expenses.forEach(x=>{const a=kop(x.amount);const who=amongOf(e,x).map(id=>idx[id]),m=who.length;if(!m)return;
    total+=a;payersOf(e,x).forEach(p=>{if(idx[p.id]!==undefined)paid[idx[p.id]]+=p.a});
    const ws=who.map(j=>wOf(e.people[j])),W=ws.reduce((t,v)=>t+v,0);who.forEach((j,k)=>owed[j]+=a*ws[k]/W)});
  // доли округляем до копеек один раз, остаток копеек отдаём самым большим дробным частям
  const fl=owed.map(v=>Math.floor(v+1e-9));let rem=total-fl.reduce((x,y)=>x+y,0);
  owed.map((v,i)=>({i,f:v-fl[i]})).sort((x,y)=>y.f-x.f||x.i-y.i).forEach(o=>{if(rem>0){fl[o.i]++;rem--}});
  for(let i=0;i<n;i++)bal[i]=paid[i]-fl[i];
  e.transfers.forEach(t=>{const a=kop(t.amount);if(idx[t.from]!==undefined&&idx[t.to]!==undefined){bal[idx[t.from]]+=a;bal[idx[t.to]]-=a}});
  const cr=[],db=[];bal.forEach((b,i)=>{if(b>0)cr.push({i,a:b});else if(b<0)db.push({i,a:-b})});
  cr.sort((a,b)=>b.a-a.a);db.sort((a,b)=>b.a-a.a);
  let plan=[];let c=0,d=0;
  while(c<cr.length&&d<db.length){const x=Math.min(cr[c].a,db[d].a);plan.push({from:e.people[db[d].i].id,to:e.people[cr[c].i].id,a:x});cr[c].a-=x;db[d].a-=x;if(!cr[c].a)c++;if(!db[d].a)d++}
  const st=roundStep(e);if(st)plan=plan.map(p=>({from:p.from,to:p.to,a:Math.round(p.a/st)*st})).filter(p=>p.a>0);
  return {total,share:n?total/n:0,bal,plan,paid,owed:fl};
}

function render(){
  const root=document.getElementById("app");
  const e=S.events.find(x=>x.id===view.event);
  closeSheet();
  root.innerHTML=view.help?helpView():e?eventView(e):homeView();
  document.body.classList.toggle("has-bnav",!!e&&!view.help);
  root.querySelectorAll("form").forEach(f=>f.noValidate=true);
  bind(e);
}

  const sec=(id,title,lead,body)=>`<details class="card help-sec" id="${id}"><summary><span>${title}<small>${lead}</small></span><i class="cat-chev" aria-hidden="true"></i></summary><div class="help-body">${body}</div></details>`;

  return `<header class="top"><button class="icon-btn" id="helpBack" aria-label="Назад">←</button><h1>Как пользоваться</h1></header>

  <section class="card help-intro">
    <p><b>«Скинемся»</b> помогает честно поделить общие траты: вы записываете, кто сколько заплатил, а приложение считает, кто кому и сколько переводит.</p>
    <div class="search-row"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="hQ" type="search" autocomplete="off" maxlength="40" placeholder="Найти в справке: доля, копия, перевод…" aria-label="Поиск по справке"></div>
    <p class="empty" id="hNone" hidden>Ничего не нашлось. Попробуйте другое слово или откройте «Частые вопросы».</p>
    <nav class="toc" aria-label="Разделы справки">${toc.map(([id,l])=>`<button type="button" class="toc-chip" data-goto="${id}">${l}</button>`).join("")}</nav>
  </section>

  <section class="card" id="h-start">
    <h2>Быстрый старт: 4 шага</h2>
    ${steps(["<b>Создайте мероприятие:</b> на главном экране «+ Новое мероприятие», название, даты, участники через запятую, «Погнали».",
      "<b>Вносите расходы:</b> вкладка «Расходы» внизу, жёлтая кнопка «+», сумма, кто платил, «Добавить».",
      "<b>Откройте «Итог»:</b> вверху «Осталось перевести» — кто кому и сколько.",
      "<b>Поделитесь итогом</b> в чат и жмите «Оплачено», когда человек перевёл деньги."])}
    ${ex("Вася заплатил за баню <b>3&nbsp;000&nbsp;₽</b> на троих. В «Итоге» появятся две строки: Петя → Вася 1&nbsp;000&nbsp;₽ и Коля → Вася 1&nbsp;000&nbsp;₽.")}
  </section>

  ${sec("h-new","Создать мероприятие","Название, даты, участники, бюджет",`
    ${fig("new","Форма «Новая тусовка»: поля название, даты, участники, бюджет и кнопка «Погнали» с номерами 1–5")}
    ${steps(["<b>Название</b> — как вы будете искать мероприятие потом: «Алтай, август», «Баня, суббота».",
      "<b>Даты «с» и «по».</b> «С» подставляется сегодняшнее, «по» нужно, если дней несколько. Без дат мероприятие не найдётся фильтрами по месяцу и году.",
      "<b>Участники через запятую.</b> Их можно добавить и позже, на вкладке «Люди».",
      "<b>Бюджет</b> — по желанию. Тогда в «Аналитике» будет видно, уложились или нет.",
      "Нажмите <b>«Погнали»</b>."])}
    ${tip("Повторяете поездку той же компанией? Нажмите «+ Участники из прошлого мероприятия» — подставятся люди, их доли и реквизиты.")}
    <p><b>Изменить название или даты</b> потом: нажмите на название вверху экрана мероприятия (рядом с датами карандаш).</p>`)}

  ${sec("h-exp","Добавить и исправить расход","Кнопка «+», несколько плательщиков, категории",`
    ${fig("exp","Вкладка «Расходы»: кнопка «+», расход в списке, крестик удаления и нижние вкладки с номерами 1–4")}
    ${steps(["<b>«+»</b> внизу справа открывает окно нового расхода.","<b>Нажмите на расход</b> в списке, чтобы исправить его.","<b>Крестик</b> удаляет расход. 10 секунд внизу будет «Вернуть».","<b>Вкладки</b> мероприятия: Расходы, Мои, Люди, Итог."])}
    ${fig("form","Окно «Новый расход»: сумма, кто платил, «Платили несколько человек», категории, на кого делим и кнопка «Добавить» с номерами 1–6")}
    ${steps(["<b>Сумма.</b> Можно с запятой: «150,50».","<b>Кто платил.</b> Если на вкладке «Мои» вы выбрали себя, подставитесь вы.","<b>Платили несколько человек</b> — впишите, кто сколько, общая сумма посчитается сама.","<b>Категории</b> — можно несколько. Редкие спрятаны под «Ещё».","<b>На кого делим.</b> Снимите отметки с тех, кого расход не касается. «Все» отмечает всех, «Никого» снимает отметки.","<b>«Добавить»</b> сохраняет расход и закрывает окно."])}
    ${ex("Шашлык за <b>1&nbsp;200&nbsp;₽</b> ели только Петя и Коля: оставьте отмеченными их двоих. Каждый должен по 600&nbsp;₽, Васи расход не касается.")}
    ${ex("Чек <b>3&nbsp;000&nbsp;₽</b>: продукты и алкоголь. Отметьте обе категории — разделится поровну. Нужно точнее: «Указать суммы вручную», продукты 2&nbsp;200, алкоголь посчитается сам — 800&nbsp;₽.")}
    <p>Закрыть окно без сохранения: «Отмена», тап по затемнению или «Назад» на Android. Расход с пометкой «из моих» при удалении вернётся в журнал «Мои».</p>`)}

  ${sec("h-people","Участники: доли и реквизиты","Пара, ребёнок, куда переводить",`
    ${fig("person","Окно участника: доля, реквизиты для перевода и кнопка «Сохранить»")}
    <p>Вкладка «Люди» → нажмите на имя участника.</p>
    ${steps(["<b>Доля.</b> Пара — 2, ребёнок — 0,5. Все общие расходы делятся с учётом долей.","<b>Реквизиты</b>: телефон для СБП или карта и банк. Видны в «Итоге», в тексте и на картинке для чата.","<b>«Сохранить».</b>"])}
    ${ex("Ужин <b>5&nbsp;000&nbsp;₽</b> на Васю (доля 2) и Колю (доля 1): Вася должен 3&nbsp;333,33&nbsp;₽, Коля 1&nbsp;666,67&nbsp;₽.")}
    <p>Добавить людей: внизу вкладки «Люди», можно сразу несколько через запятую. Удалить: крестик у имени (если у человека есть расходы, приложение переспросит; потом 10 секунд можно «Вернуть»). В следующем мероприятии реквизиты человека с тем же именем подставятся сами.</p>`)}

  ${sec("h-sum","Итог: кто кому переводит","Оплачено, напомнить, округление",`
    ${fig("sum","Вкладка «Итог»: округление, строка перевода, кнопки «Напомнить», «Реквизиты», «Оплачено» и вкладка «Итог» с красной цифрой")}
    ${steps(["<b>Округление</b>: «Точно», «До 10 ₽» или «До 100 ₽», чтобы не переводить копейки.","<b>Строка перевода</b>: кто → кому, сумма и реквизиты получателя.","<b>«Напомнить»</b> — готовое сообщение должнику с суммой и реквизитами.","<b>«Реквизиты»</b> копирует номер получателя.","<b>«Оплачено»</b> — человек перевёл. Строка исчезнет, по ошибке — «Вернуть» внизу.","<b>Красная цифра</b> на вкладке — сколько переводов осталось."])}
    <p>Ниже: <b>Баланс каждого</b> (плюс — ему должны, минус — должен он), <b>Сбор денег</b> (сколько собрано), блок <b>«Переводы»</b> (отметить перевод вручную и список «Уже переведено»), <b>«Как прошло?»</b> и свёрнутая <b>«Аналитика»</b>.</p>
    ${ex("Коля должен Васе 1&nbsp;000&nbsp;₽, но перевёл 500&nbsp;₽: «Переводы» → «Отметить перевод» → Коля → Вася, 500&nbsp;₽. Останется долг 500&nbsp;₽.")}`)}

  ${sec("h-share","Поделиться итогом","Текстом, картинкой, ссылкой, Excel",`
    ${fig("share","Меню «Поделиться итогом» с вариантами текстом, картинкой, ссылкой и таблицей Excel")}
    ${steps(["<b>Текстом</b> — итог сообщением в чат. Посмотреть текст заранее: «Посмотреть текст итога».","<b>Картинкой</b> — в теме приложения: светлая или тёмная.","<b>Ссылкой</b> — друг откроет и добавит мероприятие к себе одним нажатием.","<b>Таблицей Excel</b> — файл .xlsx: итог, расходы, переводы."])}
    ${tip("Заполните «Как прошло?» (смайлик и отзывы) до отправки — они попадут в текст и на картинку.")}`)}

    <p>Тема оформления — крайняя правая круглая кнопка вверху. «История» прокручивает к списку.</p>`)}

  ${sec("h-data","Резервная копия и где хранятся данные","Чтобы ничего не потерять",`
    ${fig("backup","Блок «Резервная копия» с кнопками «Сохранить копию» и «Загрузить из копии»")}
    ${steps(["<b>«Сохранить копию»</b> — файл с данными. Отправьте его себе в мессенджер или в «Файлы».","<b>«Загрузить из копии»</b> — на новом телефоне или чтобы взять мероприятия друга: «Добавить к текущим» или «Заменить всё»."])}

    <p><b>Важно.</b> «Добавить к текущим» и повторная ссылка заменяют такое же мероприятие целиком — ваши правки в нём пропадут. Ссылка на iPhone откроется в Safari, а не в приложении с экрана «Домой»; надёжнее файл копии. После первого открытия приложение работает без интернета.</p>`)}

  ${sec("h-faq","Частые вопросы","Если что-то пошло не так",`
    <p><b>Нажал «Оплачено», а денег не было.</b> Сразу «Вернуть» внизу экрана. Позже: «Итог» → «Переводы» → крестик у перевода.</p>
    <p><b>Удалил расход или человека по ошибке.</b> «Вернуть» внизу экрана в течение 10 секунд.</p>
    <p><b>Почему у кого-то на копейку больше?</b> 1&nbsp;000&nbsp;₽ на троих: 333,33 + 333,33 + 333,34 — лишняя копейка достаётся одному.</p>
    <p><b>Кто-то перевёл больше, чем должен.</b> Внесите перевод как есть — в «Итоге» появится, кто кому вернёт.</p>
    <p><b>Мероприятие открывается на «Расходах», а не на «Итоге».</b> Оно ещё не закончилось по датам — проверьте даты (нажмите на название).</p>
    <p><b>Как поставить на телефон?</b> Android: меню ⋮ → «Добавить на главный экран». iPhone в Safari: «Поделиться» → «На экран „Домой“».</p>
    <p><b>Сумма с копейками не принимается.</b> Пишите через запятую или точку: «150,50».</p>`)}

  <button type="button" class="btn" id="helpDone">Понятно, к приложению</button>`;
}

    <input id="evName" maxlength="80" placeholder="Название, например «Алтай, август»" required>

    <p class="hint">Дата «по» нужна, если мероприятие длилось несколько дней.</p>
    <input id="evPeople" placeholder="Участники через запятую" value="${tplE?esc(tplE.people.map(p=>p.name).join(", ")):""}">
    ${S.events.some(x=>x.people.length)?(tplE?`<p class="hint tpl-note">По образцу «${esc(tplE.name)}»: доли и реквизиты участников${Object.keys(tplE.planCats||{}).length?", план по категориям":""} перенесутся. <button type="button" class="link tpl-link" id="tplClear">Убрать</button></p>`:'<button type="button" class="link tpl-link" id="tplPick">+ Участники из прошлого мероприятия</button>'):""}
    <input id="evPlan" type="text" inputmode="decimal" autocomplete="off" class="amt" placeholder="Бюджет, ₽ (необязательно)" value="${tplE&&tplE.plan?esc(tplE.plan):""}">
    <details class="plan-edit desc-add"><summary>Добавить описание</summary><textarea id="evDesc" class="desc-input" rows="3" maxlength="2000" placeholder="Место, маршрут, что взять с собой, договорённости"></textarea></details>

    <p class="hint" style="margin-top:10px">${f.q?(shown.length?`По «${esc(f.q)}» найдено: ${shown.length} · потрачено ${rubShort(sumAll)}. Список и статистика ниже — только по найденным.`:`По «${esc(f.q)}» ничего не найдено${f.mode!=="all"?" в выбранном фильтре":""}.`):f.mode==="pick"?(shown.length?`Выбрано: ${shown.length} · потрачено ${rubShort(sumAll)}`:"Нажмите «Выбрать» и отметьте нужные мероприятия."):f.mode==="fav"?(shown.length?`В избранном: ${shown.length} · потрачено ${rubShort(sumAll)}`:"В избранном пока пусто. Откройте мероприятие и нажмите звёздочку вверху."):f.mode==="all"?`Всего мероприятий: ${S.events.length}`:`Найдено ${shown.length} из ${S.events.length} · потрачено ${rubShort(sumAll)}`}</p></section>`:""}
  ${list||(S.events.length?(f.q?'':'<p class="empty">За этот период мероприятий нет.</p>'):'<p class="empty">Пока пусто. Создайте первое мероприятие: поездку, встречу или совместную закупку.</p><button type="button" class="first-help" id="firstHelp">Впервые здесь? <b>Как пользоваться за 1 минуту →</b></button>')}
  ${statsCard(shown)}
  <section class="card"><h2>Резервная копия</h2>

    <div class="row-actions"><button class="btn" id="exportBtn">Сохранить копию</button><button class="btn ghost" id="importBtn">Загрузить из копии</button></div>

function eventView(e){

  const opts=(sel)=>e.people.map(p=>`<option value="${esc(p.id)}"${p.id===sel?" selected":""}>${esc(p.name)}</option>`).join("");
  let body="";
  if(t==="exp"){
    const ed=e.expenses.find(x=>x.id===view.edit);const inSplit=ed?amongOf(e,ed):e.people.map(p=>p.id);
    body=`<section class="card" id="expList"><h2>Расходы${e.expenses.length?` · ${e.expenses.length}`:""}</h2>${e.expenses.length?e.expenses.map(x=>`<div class="item${x.id===view.edit?" editing":""}"><button class="main edit" data-edit-exp="${esc(x.id)}">${esc(payersLabel(e,x))}<small>${x.fromMine?'<span class="tag">из моих</span> ':""}${catsOf(x).length?`<span class="cat">${esc(catsLabel(x))}</span>${isManual(x)?' <span class="tag">суммы вручную</span>':""} · `:""}${x.note?esc(x.note)+" · ":""}${esc(amongLabel(e,x))}</small></button><span class="sum">${rub(kop(x.amount))}</span><button class="link danger" data-del-exp="${esc(x.id)}" aria-label="Удалить">×</button></div>`).join(""):`<p class="empty">Расходов пока нет.</p>${e.people.length?'<button type="button" class="first-help" id="toAddExp">Добавьте первый расход: кто платил и сколько <b>↓</b></button>':'<button type="button" class="first-help" id="toPeople">Сначала добавьте участников <b>→</b></button>'}`}${e.expenses.length?'<p class="empty">Нажмите на расход, чтобы изменить его.</p>':""}</section>

      <input id="expAmount" type="text" inputmode="decimal" autocomplete="off" class="amt amt-big" placeholder="Сумма, ₽" required value="${ed?esc(ed.amount):""}">

      ${e.people.length>1?`<button type="button" class="link acc" id="multiToggle">${ed&&payersOf(e,ed).length>1?"Платил один человек":"Платили несколько человек"}</button>
      <div class="catsplit" id="multiPay" hidden><p class="hint">Сколько заплатил каждый. Пустые строки не учитываются.</p>
        ${e.people.map(p=>{const v=ed?(payersOf(e,ed).length>1?(ed.payers.find(q=>q.id===p.id)||{}).amount:""):"";return `<label class="ca-row"><span>${esc(p.name)}</span><input data-pay="${esc(p.id)}" type="text" inputmode="decimal" autocomplete="off" class="amt" placeholder="0" value="${v?esc(v):""}"></label>`}).join("")}
        <div class="ca-row"><span>Итого</span><b id="multiSum">0 ₽</b></div><p class="err" id="multiErr" hidden>Укажите сумму хотя бы у одного человека.</p></div>`:""}

      ${e.people.length?'<p class="hint" style="margin-top:10px">Нажмите на имя, чтобы указать долю (пара, ребёнок) и реквизиты для перевода.</p>':""}

const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
// «28 сентября 2026», «28–30 сентября 2026», «28 сентября – 2 октября 2026»
function periodRu(e){
  const a=e.date,b=e.dateTo&&e.dateTo!==e.date?e.dateTo:"";if(!a)return "";
  const [y1,m1,d1]=a.split("-").map(Number);if(!b)return `${d1} ${MONTHS[m1-1]} ${y1}`;
  const [y2,m2,d2]=b.split("-").map(Number);
  if(y1===y2&&m1===m2)return `${d1}–${d2} ${MONTHS[m1-1]} ${y1}`;
  if(y1===y2)return `${d1} ${MONTHS[m1-1]} – ${d2} ${MONTHS[m2-1]} ${y1}`;
  return `${d1} ${MONTHS[m1-1]} ${y1} – ${d2} ${MONTHS[m2-1]} ${y2}`;
}
// диапазон фильтра [from,to] в формате ГГГГ-ММ-ДД; пустая граница = без ограничения
function filterRange(f){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),iso=(Y,M,D)=>new Date(Date.UTC(Y,M,D)).toISOString().slice(0,10);
  if(f.mode==="month")return [iso(y,m,1),iso(y,m+1,0)];
  if(f.mode==="prev")return [iso(y,m-1,1),iso(y,m,0)];
  if(f.mode==="year")return [iso(y,0,1),iso(y,11,31)];
  if(f.mode==="range")return [f.from||"",f.to||""];
  return null;
}
// варианты фильтра «Показать»: ключ, короткое и полное название, пояснение
const FMODES=[["all","Все","Все мероприятия",""],["fav","★ Избранное","★ Избранное","Отмеченные звёздочкой"],["month","Этот месяц","Этот месяц",""],["prev","Прошлый месяц","Прошлый месяц",""],
  ["year","Этот год","Этот год",""],["range","Период","Свой период","Укажете даты «с» и «по»"],["pick","Выбрать","Выбранные мероприятия","Отметить нужные в списке"]];
// поиск по словам: название, описание, участники, «за что» в расходах; все слова должны найтись, ё = е
const normS=t=>String(t||"").toLowerCase().replace(/ё/g,"е");
const searchText=e=>normS([e.name,e.desc,e.liked,e.disliked,...e.people.map(p=>p.name),...e.expenses.map(x=>x.note)].join(" "));
const matchQ=(e,q)=>{const w=normS(q).split(/[\s,.;:!?«»"'()]+/).filter(Boolean);if(!w.length)return true;const h=searchText(e);return w.every(x=>h.includes(x))};
function filterEvents(list,f){return filterMode(list,f).filter(e=>!f.q||matchQ(e,f.q))}
function filterMode(list,f){
  if(f.mode==="fav")return list.filter(e=>e.fav);
  if(f.mode==="pick"){const ids=new Set(f.ids||[]);return list.filter(e=>ids.has(e.id))}
  const r=filterRange(f);if(!r)return list.slice();
  const [from,to]=r;
  return list.filter(e=>{if(!e.date)return false;const s=e.date,t=e.dateTo&&e.dateTo>e.date?e.dateTo:e.date;
    return (!from||t>=from)&&(!to||s<=to)});
}
function dateRu(d){try{return d?new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}).replace(" г.",""):""}catch(err){return ""}}
const trWord=n=>n%10===1&&n%100!==11?"перевод":n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?"перевода":"переводов";
// переводы, сгруппированные по получателю
function groupsOf(e,s){const g=[];s.plan.forEach(p=>{let x=g.find(y=>y.to===p.to);if(!x){x={to:p.to,sum:0,rows:[]};g.push(x)}x.sum+=p.a;x.rows.push(p)});return g.sort((a,b)=>b.sum-a.sum)}
function planCard(e,s){
  const plan=kop(e.plan||0),pc=e.planCats||{},fact=s.total,cf=catFact(e),n=e.people.length;
  const catPlans=CATS.filter(c=>kop(pc[c[0]]||0)>0);

    ${n?`<p class="hint">На человека: план ${rubShort(Math.round(plan/n/100)*100)}, факт ${rubShort(Math.round(fact/n/100)*100)}</p>`:""}`}
  else top=`<p class="hint">План необязателен. Укажите бюджет, и здесь появится сравнение с фактическими тратами.</p>`;

  return `<section class="card" id="planCard"><h2>План и факт</h2>${top}
    ${rows?`<div class="pftable"><div class="pfrow head"><span>Категория</span><span>План</span><span>Факт</span><span>Разница</span></div>${rows}</div>`:""}

      <form class="form" id="planForm"><label class="lbl">Бюджет на всё мероприятие, ₽<input id="planTotal" type="text" inputmode="decimal" autocomplete="off" class="amt" value="${esc(e.plan||"")}" placeholder="Например, 20000"></label>
      <p class="hint">По категориям, если хотите (можно оставить пустыми):</p>
      <div class="plancats">${CATS.map(([k,l])=>`<label class="lbl">${l}<input data-plancat="${k}" type="text" inputmode="decimal" autocomplete="off" class="amt" value="${esc(pc[k]||"")}"></label>`).join("")}</div>
      <div class="row-actions"><button class="btn small">Сохранить план</button>${plan||catPlans.length?'<button type="button" class="link danger" id="planClear">Убрать план</button>':""}</div></form></details></section>`;
}
// строки сравнения: {label,a,b,money,neutral,total,sub}
function compareRows(e,s,o){const so=settle(o),n1=e.people.length,n2=o.people.length,d1=daysOf(e),d2=daysOf(o),r100=v=>Math.round(v/100)*100;
  const rows=[{label:"Всего",a:s.total,b:so.total,money:true,total:true},{label:"Людей",a:n1,b:n2,neutral:true},{label:"Дней",a:d1||null,b:d2||null,neutral:true},
    {label:"На человека",a:n1?r100(s.total/n1):null,b:n2?r100(so.total/n2):null,money:true}];
  if(d1&&d2&&n1&&n2)rows.push({label:"На чел. в день",a:r100(s.total/n1/d1),b:r100(so.total/n2/d2),money:true});
  const cf1=catFact(e),cf2=catFact(o),cats=CATS.filter(c=>cf1[c[0]]||cf2[c[0]]);
  if(cats.length){rows.push({sub:true,label:"По категориям"});cats.forEach(([k,l])=>rows.push({label:l,a:cf1[k]||0,b:cf2[k]||0,money:true}))}
  return rows.map(r=>{if(r.sub||r.a==null||r.b==null)return r;const d=r.a-r.b;return Object.assign(r,{d,pc:r.b?Math.abs(d)*100/r.b:0,cls:r.neutral||!d?"":(d<0?"good":"bad")})})}
const r100=v=>Math.round(v/100)*100;
const cmpVal=(r,v)=>v==null?"—":r.money?rubShort(r100(v)):String(v);
const cmpDiff=r=>r.d==null?"—":`${r.d>0?"+":r.d<0?"−":""}${r.money?rubShort(r100(Math.abs(r.d))):Math.abs(r.d)}`;
function compareTarget(e){const sim=similarEvents(e);if(!sim.length)return {sim,o:null};let o=S.events.find(x=>x.id===e.compareWith&&x.id!==e.id);if(!o&&e.compareWith!=="none")o=sim[0].x;return {sim,o}}
// вывод сравнения: больше или меньше потратили, на человека, что изменилось сильнее всего
function compareVerdict(e,s,o){const so=settle(o),n1=e.people.length,n2=o.people.length,d=r100(s.total-so.total),p=so.total?Math.abs(s.total-so.total)*100/so.total:0;
  const main=!d?"Вы потратили столько же, сколько тогда.":`Вы потратили ${d>0?"больше":"меньше"}: на ${rubShort(Math.abs(d))}${so.total?` (${d>0?"+":"−"}${pct(p)})`:""}.`;
  const notes=[];
  if(n1&&n2){const a=s.total/n1,b=so.total/n2,dp=r100(a-b);
    notes.push(!dp?"На человека — столько же.":`На человека — ${dp>0?"больше":"меньше"} на ${rubShort(Math.abs(dp))}.`);

// ---------- резервная копия ----------
const evWord=n=>n+" "+(n%10===1&&n%100!==11?"мероприятие":n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?"мероприятия":"мероприятий");
// приводим данные к безопасному виду: id только из букв/цифр, строки ограниченной длины, суммы ≥ 0, даты ГГГГ-ММ-ДД
function sanitizeState(st){
  const okId=v=>typeof v==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(v);
  const str=(v,n)=>String(v==null?"":v).slice(0,n);
  const amt=v=>{const t=String(v==null?"":v).replace(/[\s\u00a0]/g,"").replace(",",".");const n=parseFloat(t);return isFinite(n)&&n>=0&&n<1e9?t.slice(0,16):"0"};
  const date=v=>{if(typeof v!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(v))return "";const d=new Date(v+"T00:00:00Z");return !isNaN(d)&&d.toISOString().slice(0,10)===v?v:""};
  const catKeys=new Set(CATS.map(c=>c[0])),moodKeys=new Set(MOODS.map(m=>m[0]));
  const events=[],seenEv=new Set();
  (Array.isArray(st&&st.events)?st.events:[]).slice(0,500).forEach(e=>{
    if(!e||typeof e!=="object")return;
    let eid=okId(e.id)&&!seenEv.has(e.id)?e.id:uid();seenEv.add(eid);
    const map={},people=[];
    (Array.isArray(e.people)?e.people:[]).slice(0,200).forEach(p=>{if(!p)return;const nid=okId(p.id)&&!map[p.id]?p.id:uid();if(p.id!=null)map[p.id]=nid;const w=Number(p.w),pay=str(p.pay,80).trim();const o={id:nid,name:str(p.name,60).trim()||"Без имени"};if(W_OPTS.includes(w)&&w!==1)o.w=w;if(pay)o.pay=pay;people.push(o)});
    const pid=v=>map[v]||null;
    const cats=a=>(Array.isArray(a)?a:[]).filter(k=>catKeys.has(k));
    const catAm=o=>{if(!o||typeof o!=="object")return null;const r={};Object.keys(o).forEach(k=>{if(catKeys.has(k))r[k]=amt(o[k])});return Object.keys(r).length?r:null};
    const expenses=(Array.isArray(e.expenses)?e.expenses:[]).slice(0,5000).filter(x=>x&&pid(x.payer)).map(x=>{
      const c=cats(Array.isArray(x.cats)?x.cats:(x.cat?[x.cat]:[]));
      const among=Array.isArray(x.among)?x.among.map(pid).filter(Boolean):null;
      const pays=Array.isArray(x.payers)?x.payers.slice(0,200).filter(q=>q&&pid(q.id)).map(q=>({id:pid(q.id),amount:amt(q.amount)})):[];
      const o={id:okId(x.id)?x.id:uid(),payer:pid(x.payer),amount:amt(x.amount),cats:c,catAmounts:catAm(x.catAmounts),note:str(x.note,300),among:among&&among.length?among:null,fromMine:!!x.fromMine};
      if(pays.length>1)o.payers=pays;return o});
    const expIds=new Set(expenses.map(x=>x.id));
    const transfers=(Array.isArray(e.transfers)?e.transfers:[]).slice(0,5000).filter(t=>t&&pid(t.from)&&pid(t.to)&&pid(t.from)!==pid(t.to))
      .map(t=>({id:okId(t.id)?t.id:uid(),from:pid(t.from),to:pid(t.to),amount:amt(t.amount)}));
    const mine=(Array.isArray(e.mine)?e.mine:[]).slice(0,5000).filter(Boolean).map(x=>{const pushedTo=okId(x.pushedTo)&&expIds.has(x.pushedTo)?x.pushedTo:undefined;
      const o={id:okId(x.id)?x.id:uid(),amount:amt(x.amount),note:str(x.note,120),cats:cats(Array.isArray(x.cats)?x.cats:(x.cat?[x.cat]:[])),personal:!!x.personal,pushed:!!x.pushed,ts:Number(x.ts)||Date.now()};
      if(pushedTo)o.pushedTo=pushedTo;return o});
    const planCats={};if(e.planCats&&typeof e.planCats==="object")Object.keys(e.planCats).forEach(k=>{if(catKeys.has(k))planCats[k]=amt(e.planCats[k])});
    events.push({id:eid,name:str(e.name,80).trim()||"Без названия",date:date(e.date),dateTo:date(e.dateTo),people,expenses,transfers,mine,
      me:pid(e.me)||"",plan:e.plan?amt(e.plan):"",planCats,desc:str(e.desc,2000),liked:str(e.liked,500),disliked:str(e.disliked,500),
      mood:moodKeys.has(e.mood)?e.mood:"",fav:!!e.fav,imported:!!e.imported,round:e.round===10||e.round===100?e.round:0,compareWith:okId(e.compareWith)||e.compareWith==="none"?e.compareWith:""});
  });
  const f=st&&st.filter&&typeof st.filter==="object"?st.filter:{};
  return {events,filter:{mode:["all","fav","month","prev","year","range","pick"].includes(f.mode)?f.mode:"all",from:date(f.from),to:date(f.to),q:typeof f.q==="string"?f.q.slice(0,60):"",ids:Array.isArray(f.ids)?f.ids.filter(okId).slice(0,500):[]},
    lastBackup:typeof(st&&st.lastBackup)==="string"?st.lastBackup.slice(0,40):undefined,
    lastChange:Number(st&&st.lastChange)||0,backupSnooze:Number(st&&st.backupSnooze)||0};
}
function validBackup(d){return d&&Array.isArray(d.events)&&d.events.every(e=>e&&e.id&&Array.isArray(e.people)&&Array.isArray(e.expenses)&&Array.isArray(e.transfers))}
function bindBackup($){
  const msg=t=>{$("backupMsg").textContent=t;$("backupMsg").hidden=false};
  const stamp=()=>{S.lastBackup=new Date().toISOString();save(true);const n=document.querySelector(".nag");if(n)n.remove()};
  $("exportBtn").onclick=async()=>{
    const data=JSON.stringify({app:"skinemsya",version:1,saved:new Date().toISOString(),events:S.events},null,1);
    const fname=`skinemsya-${new Date().toISOString().slice(0,10)}.json`;
    // 1) страница внутри Claude
    try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
      if(dl){await dl.save({filename:fname,data});stamp();msg("Копия сохранена: "+fname);return}}catch(err){}
    // 2) меню «Поделиться» на телефоне: Файлы, Telegram, почта
    try{const file=new File([data],fname,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Скинемся: копия"});stamp();msg("Копия отправлена: "+fname);return}}
    catch(err){if(err&&err.name==="AbortError"){msg("Сохранение отменено.");return}}
    // 3) обычное скачивание
    try{const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);stamp();msg("Файл "+fname+" скачан. Если он не появился, скопируйте текст ниже и сохраните его в заметку.")}
    catch(err){msg("Не удалось сохранить файл. Скопируйте текст ниже и сохраните его в заметку.")}
    const ta=$("backupText");ta.value=data;ta.hidden=false;
  };
  let pending=null;
  $("importBtn").onclick=()=>{$("importFile").value="";$("importFile").click()};
  $("importFile").onchange=ev=>{const f=ev.target.files[0];if(!f)return;
    if(f.size>5*1024*1024){msg("Файл слишком большой для копии «Скинемся» (больше 5 МБ).");return}
    const r=new FileReader();
    r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(err){}
      if(!validBackup(d)){msg("Это не файл копии «Скинемся». Выберите файл skinemsya-….json.");return}
      pending=sanitizeState(d);const sv=d.saved?new Date(d.saved):null;$("importInfo").textContent=`В копии ${evWord(pending.events.length)}${sv&&!isNaN(sv)?", сохранена "+sv.toLocaleString("ru-RU"):""}. Как загрузить?`;
      $("importAsk").hidden=false;$("backupMsg").hidden=true};
    r.readAsText(f)};
  $("importCancel").onclick=()=>{pending=null;$("importAsk").hidden=true};
  $("importMerge").onclick=()=>{if(!pending)return;let added=0,upd=0;
    pending.events.forEach(ne=>{const i=S.events.findIndex(x=>x.id===ne.id);if(i<0||S.events[i].imported)ne.imported=true;if(i>=0){S.events[i]=ne;upd++}else{S.events.push(ne);added++}});
    pending=null;save();render();msgAfter(`Загружено: новых ${added}, обновлено ${upd}.`)};
  $("importReplace").onclick=()=>{if(!pending)return;
    if($("importReplace").dataset.armed!=="1"){$("importReplace").dataset.armed="1";$("importReplace").textContent="Точно заменить? Нажмите ещё раз";return}
    const n=pending.events.length;S.events=pending.events;pending=null;save();render();msgAfter(`Данные заменены: ${evWord(n)}.`)};
}
function msgAfter(t){const m=document.getElementById("backupMsg");if(m){m.textContent=t;m.hidden=false}}
// своя проверка пустых полей вместо системной подсказки браузера
document.addEventListener("submit",ev=>{const bad=[...ev.target.querySelectorAll("[required]")].find(i=>!String(i.value).trim());
  if(bad){ev.preventDefault();ev.stopImmediatePropagation();bad.classList.add("invalid");bad.placeholder=bad.placeholder.replace(/^Заполните: /,"");bad.placeholder="Заполните: "+bad.placeholder;bad.focus()}},true);
document.addEventListener("input",ev=>{const t=ev.target;if(t.classList)t.classList.remove("invalid");
  if(t.classList&&t.classList.contains("amt")){let v=t.value.replace(/[^\d.,]/g,""),i=v.search(/[.,]/);if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/[.,]/g,"").slice(0,2);if(v.length>12)v=v.slice(0,12);if(v!==t.value)t.value=v}});
S=sanitizeState(S);
render();
checkLinkImport();
// офлайн-режим: только на настоящем сайте (не внутри Claude и не из файла)
try{if("serviceWorker" in navigator&&window.isSecureContext&&window.top===window&&location.protocol!=="file:")
  navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(err){}
</script>

</body></html>
