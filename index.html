<title>Скинемся</title>

<style>
:root{
  --bg:#f3f3f7;--card:#ffffff;--ink:#16151c;--muted:#6c6b7a;--line:#e5e4ec;--field:#f6f6f9;
  --accent:#3b4bf5;--accent-ink:#ffffff;--soft:#e9ebff;
  --sun:#ffd43b;--coral:#ff7a59;--mint:#2bd4a4;--lilac:#b18cff;--sky:#4cc2ff;
  --owe:#e5484d;--get:#12a150;--get-soft:#ddf6e7;--owe-soft:#fde8e8;
  --sans:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --mono:"Manrope",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0e0e13;--card:#191920;--ink:#f2f2f6;--muted:#9b9aab;--line:#2a2a35;--field:#121218;
  --accent:#8b95ff;--accent-ink:#0e0e13;--soft:#23264a;--owe:#ff6b6e;--get:#3dd68c;--get-soft:#153323;--owe-soft:#3a1a1c}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0e0e13;--card:#191920;--ink:#f2f2f6;--muted:#9b9aab;--line:#2a2a35;--field:#121218;
  --accent:#8b95ff;--accent-ink:#0e0e13;--soft:#23264a;--owe:#ff6b6e;--get:#3dd68c;--get-soft:#153323;--owe-soft:#3a1a1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
body{color:var(--ink);font:500 16px/1.45 var(--sans);padding-inline:16px;padding-block:14px 48px;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:var(--bg)}
.app>*,.card>*,.form>*{min-width:0}
.invalid{border-color:var(--owe)!important}

/* логотип */
.brand{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:6px 2px 4px}
.brand>*{min-width:0}
.logo{display:flex;align-items:center;gap:12px}
.coins{display:flex;flex:none}
.coins i{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);display:block;margin-left:-11px}
.coins i:first-child{margin-left:0;background:var(--sun)}
.coins i:nth-child(2){background:var(--coral)}
.coins i:nth-child(3){background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:800 13px var(--display);font-style:normal}
.word{font:800 30px/1 var(--display);font-size:clamp(20px,6.4vw,30px);letter-spacing:-.03em;text-transform:lowercase;white-space:nowrap;min-width:0;overflow:hidden}
.word em{font-style:normal;color:var(--accent)}
.tagline{color:var(--muted);font-size:15px;margin:0}

header.top{display:flex;align-items:center;gap:12px;min-height:48px}
header.top h1{font:800 22px/1.15 var(--display);letter-spacing:-.02em;margin:0;flex:1;text-wrap:balance;overflow-wrap:anywhere}
h1 .per{display:block;font:500 14px var(--sans);letter-spacing:0;color:var(--muted);margin-top:4px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font:700 22px/1 var(--sans);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}

.card{scroll-margin-top:64px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 var(--line)}
h2{font:700 13px var(--sans);color:var(--muted);margin:0 0 12px;letter-spacing:.01em}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--accent);background-color:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0;-webkit-appearance:none;appearance:none;opacity:1}
input:focus,select:focus,textarea:focus{background-color:var(--field);color:var(--ink);-webkit-text-fill-color:var(--ink);border-color:var(--accent);outline:none}
input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--field) inset;-webkit-text-fill-color:var(--ink)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=number]{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
input[type=date]{min-height:48px;padding:10px 8px 10px 12px;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;text-align:left}
input[type=date]::-webkit-datetime-edit,input[type=date]::-webkit-datetime-edit-fields-wrapper{padding:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0 0 0 2px;padding:0;width:16px;height:16px;opacity:.6}
input[type=date]::-webkit-date-and-time-value{text-align:left}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:13px 20px;background:var(--sun);color:#16151c;font-weight:800;min-height:48px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.form>.btn,.form>.row-actions>.btn:first-child{width:100%}
.form>.row-actions>.btn:first-child{flex:1}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.small{padding:8px 14px;font-size:14px;min-height:36px}
.link{border:0;background:none;color:var(--muted);padding:6px;font-size:14px;font-weight:600}
.link.danger{color:var(--owe)}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 130px;gap:10px}
.form .three{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;margin:4px 2px}
.err{color:var(--owe);font-size:14px;margin:0}

/* вкладки */
.tabs{display:grid;grid-template-columns:1.15fr .8fr .75fr 1.15fr .8fr;background:var(--card);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 0 var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tabs button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:10px 0;font-size:13px;font-weight:700;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tabs button.tab-mine{color:var(--accent);background:var(--soft)}
.tabs button.tab-mine[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
.tabs button.tab-sum{background:var(--sun);color:#16151c;font-weight:800;margin-left:2px}
.tabs button.tab-sum[aria-selected=true]{background:var(--sun);color:#16151c;box-shadow:inset 0 0 0 2.5px var(--ink)}

/* сводка мероприятия */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;background:var(--accent);color:var(--accent-ink);box-shadow:none;position:relative;overflow:hidden}
.stats::after{content:"";position:absolute;right:-34px;bottom:-44px;width:96px;height:96px;border-radius:50%;background:var(--sun);opacity:.9}
.stats div{font-size:12px;font-weight:600;opacity:.85;position:relative;z-index:1}
.stats div{min-width:0}
.stats b{display:block;font:800 18px/1.3 var(--display);font-size:clamp(13px,4.5vw,18px);letter-spacing:-.02em;opacity:1;margin-top:4px;white-space:nowrap}

/* строки */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;font-weight:600}
.item .main small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:1px}
.item .main.edit{border:0;background:none;text-align:left;color:var(--ink);padding:0}
.item.editing{background:var(--soft);margin-inline:-16px;padding-inline:16px;border-radius:12px}
.arrow{color:var(--muted);font-weight:500}
.sum{font:800 15px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum.p{color:var(--get)} .sum.n{color:var(--owe)}

/* аватарки */
.ava{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:600 12px var(--display);color:#fff;text-transform:uppercase}
.ava.c0{background:var(--accent);color:var(--accent-ink)}.ava.c1{background:var(--coral)}.ava.c2{background:var(--sun);color:#16151c}
.ava.c3{background:var(--mint);color:#0e2a22}.ava.c4{background:var(--lilac)}.ava.c5{background:var(--sky);color:#0b2533}
.stack{display:flex;margin-top:8px}
.stack .ava{width:26px;height:26px;font-size:10px;margin-left:-7px;box-shadow:0 0 0 2px var(--card)}
.stack .ava:first-child{margin-left:0}
.stack .more{background:var(--line);color:var(--muted)}

/* список мероприятий */
.event{width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:16px;color:var(--ink);display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line)}
.event:active{transform:scale(.99)}
.ev-wrap{position:relative}
.ev-wrap .event{align-items:flex-start;min-height:104px}
.ev-del{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;border:0;padding:0;background:var(--owe-soft);color:var(--owe);display:grid;place-items:center}
.ev-del:active{transform:scale(.92)}
.event .main{flex:1;min-width:0}
.event b{font:800 17px/1.2 var(--display);letter-spacing:-.02em;display:block}
.event small{color:var(--muted);display:block;font-size:13px;margin-top:4px}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--get-soft);color:var(--get);white-space:nowrap}
.pill.warn{background:var(--owe-soft);color:var(--owe)}

/* чипы */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--field);border-radius:999px;padding:4px 4px 4px 4px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.chip .ava{width:26px;height:26px;font-size:10px}
.chip button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 8px 2px 0}
.split-head{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.split-head span{flex:1}
.pick{position:relative;cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.pick input:checked+span{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.pick input:checked+span::before{content:"✓ ";font-weight:800}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cat{color:var(--accent);font-weight:700}

.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dates label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
@media (max-width:350px){.dates{grid-template-columns:1fr}}

.catrow{padding:7px 0}
.catline{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600}
.catline small{color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--field);margin-top:7px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.catrow:nth-child(6n+2) .bar i{background:var(--coral)}.catrow:nth-child(6n+3) .bar i{background:var(--sun)}
.catrow:nth-child(6n+4) .bar i{background:var(--mint)}.catrow:nth-child(6n+5) .bar i{background:var(--lilac)}.catrow:nth-child(6n) .bar i{background:var(--sky)}

.preview{white-space:pre-wrap;font:500 14px/1.55 var(--sans);background:var(--field);border-radius:14px;padding:14px;margin:12px 0 0;overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px var(--line)}
#imgBox{margin-top:12px;display:grid;gap:10px}
#imgBox img{width:100%;border-radius:14px;box-shadow:0 1px 0 var(--line)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf div{min-width:0;background:var(--field);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.pf span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.pf b{font:800 18px/1.3 var(--display);font-size:clamp(13px,4.4vw,18px);letter-spacing:-.02em;white-space:nowrap}
.meter{height:10px;border-radius:5px;background:var(--field);margin:12px 0 8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;border-radius:5px;background:var(--get)}
.meter.bad i{background:var(--owe)}
.verdict{margin:0 0 4px;font-weight:700;padding:10px 12px;border-radius:14px}
.verdict.good{background:var(--get-soft);color:var(--get)}.verdict.bad{background:var(--owe-soft);color:var(--owe)}
.good{color:var(--get)}.bad{color:var(--owe)}
.pftable{margin-top:12px;display:grid;font-size:14px}
.pfrow{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 1fr 1.1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pfrow:last-child{border-bottom:0}
.pfrow span{font-variant-numeric:tabular-nums;font-weight:600;overflow-wrap:anywhere;min-width:0}
.pfrow span:not(:first-child){text-align:right;font-weight:700}
.pfrow small{display:block;font-size:11px;font-weight:600;opacity:.85}
.pfrow.head span{font-size:12px;color:var(--muted);font-weight:700}
.pfrow.sub span{font-size:12px;color:var(--muted);font-weight:700;padding-top:6px}
.plan-edit{margin-top:12px}
.plan-edit summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.plan-edit .form{margin-top:10px}
.lbl{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.plancats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.desc-input{font:500 16px/1.45 var(--sans);min-height:0;resize:vertical}
.desc-add textarea{margin-top:8px}
.desc{padding:14px 16px}
.desc-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5}
.desc-text.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc .link{padding:6px 0 0;color:var(--accent)}
.event .desc-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.check input{width:22px;height:22px;padding:0;border-radius:7px;flex:none;accent-color:var(--accent);-webkit-appearance:checkbox;appearance:auto}
.item.muted .main,.item.muted .sum{opacity:.55}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.tag{white-space:nowrap;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--field);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.hint.ok{color:var(--get);font-weight:700;margin-top:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pick-sum{display:flex;align-items:baseline;gap:10px;margin-top:10px;font-size:14px;font-weight:600}
.pick-sum span{flex:1;min-width:0;overflow-wrap:anywhere}
.pick-sum .link{flex:none}
.tr-row{padding:10px 0;border-bottom:1px solid var(--line)}.tr-row:last-of-type{border-bottom:0}
.tr-row .item{padding:0;border:0}
.tr-acts{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.tr-acts .btn.small{padding:8px 6px;font-size:13px;width:100%}
.pay-line{color:var(--get);font-weight:600;overflow-wrap:anywhere}
.round-chips{margin:0 0 6px}
.nag{background:var(--owe-soft);box-shadow:none;display:grid;gap:6px}
.nag b{color:var(--owe);font-weight:800}
.nag .hint{color:var(--ink);opacity:.8}
.stats-card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font:800 16px/1.3 var(--display);letter-spacing:-.01em}
.stats-card summary::-webkit-details-marker{display:none}
.stats-card summary span{flex:1}
.stats-card[open] summary .cat-chev{transform:rotate(45deg)}
.stats-card summary .cat-chev{margin:0}
.st-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.st-row:last-of-type{border-bottom:0}
.st-row .main{flex:1;min-width:0}
.st-row .main b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .main small{color:var(--muted);font-size:12px}
.st-row .sum{text-align:right}.st-row .sum small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.st-bars{display:grid;gap:3px;margin-top:5px}
.st-bars i{display:block;height:5px;border-radius:3px;min-width:2px}
.st-bars .pd{background:var(--accent)}.st-bars .pt{background:var(--sun)}
.two.multi-on{grid-template-columns:1fr}.two.multi-on .picker{display:none}
input[readonly]{opacity:.75}
.chip-main{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:inherit;font:inherit;padding:0;text-align:left}
.pay-tag{color:var(--get);background:var(--get-soft);box-shadow:none}
.tpl-link{color:var(--accent);padding:2px 0;justify-self:start;text-align:left}
.party .tpl-link{color:#ffe27a}
.tpl-note .tpl-link{display:inline;padding:0 0 0 4px}
.more-cats{display:contents}
.more-btn{border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--soft)}
.brand-row{display:flex;align-items:center;gap:8px}
.brand-row .logo{flex:1;min-width:0;gap:clamp(6px,2.4vw,12px)}
.brand-row .icon-btn{width:42px;height:42px}
@media (max-width:359px){.brand-row .coins i{width:26px;height:26px;margin-left:-10px}.brand-row .coins i:first-child{margin-left:0}.brand-row .coins i:nth-child(3){font-size:11px}.word{font-size:18px}}
.theme-btn{display:grid;place-items:center}
.picker{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--field);color:var(--ink);border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:14px;padding:9px 14px;min-height:48px;font:inherit;font-size:16px;font-weight:600}
.picker:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);outline:none}
.pk-main{flex:1;min-width:0;display:grid}
.pk-label{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.25}
.sheet-row .pk-label{display:block;-webkit-line-clamp:unset}
.pk-ph{color:var(--muted);font-weight:500}
.pk-sub{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px)}
.picker .ava{width:28px;height:28px;font-size:11px}
.star{color:#f5b301}
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(10,10,20,.45);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:78vh;max-height:78dvh;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-wrap.open .sheet{transform:none}.sheet-wrap.open .sheet-bg{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{transition:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet h3{font:800 18px/1.2 var(--display);letter-spacing:-.02em;margin:0 4px 10px}
.sheet-list{overflow-y:auto;display:grid;gap:4px;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.sheet-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);border-radius:16px;padding:10px 12px;min-height:56px;font:inherit;font-size:16px;font-weight:600}
.sheet-row:active{background:var(--field)}
.sheet-row.on{background:var(--soft);color:var(--accent)}
.sheet-row .ava{width:34px;height:34px;font-size:13px}
.sh-ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--ink)}
.sheet-row.on .sh-ico{background:var(--accent);color:var(--accent-ink)}
.sh-check{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}
.sheet-row.on .sh-check{background:var(--accent);box-shadow:none;position:relative}
.sheet-row.on .sh-check::after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border-right:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(45deg)}
.sheet-close{width:100%;flex:none}
.pp{display:grid;gap:2px}
.pp span{font-size:13px;font-weight:700;color:var(--muted)}
.pp b{font:800 26px/1.2 var(--display);letter-spacing:-.02em}
.pp small{font-size:13px;color:var(--muted);margin-top:4px}
.catsplit{display:grid;gap:8px;background:var(--field);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1px var(--line)}
.catsplit .hint{margin:0}
.ca-row{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:10px;font-size:14px;font-weight:600}
.ca-row input{padding:9px 12px;background:var(--card)}
.ca-row b{text-align:right;padding-right:12px;font-variant-numeric:tabular-nums}
.ca-row b.bad{color:var(--owe)}
.link.acc{color:var(--accent);padding:2px 0;justify-self:start}
.mood-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood-btn{display:grid;justify-items:center;gap:4px;border:0;border-radius:16px;padding:12px 4px;background:var(--field);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);font:600 12px var(--sans);text-align:center;min-width:0}
.mood-btn span:last-child{max-width:100%;overflow-wrap:anywhere;letter-spacing:-.01em}
@media (max-width:370px){.mood-btn{font-size:11px}}
.mood-btn{padding:14px 4px}
.mood-btn .em{display:block;width:46px;height:46px;transform:scale(.9);transition:transform .18s cubic-bezier(.3,1.6,.5,1),filter .18s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
.mood-btn .em svg{width:100%;height:100%;display:block}
.mood-btn:active .em{transform:scale(.82)}
.mood-btn.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.mood-btn.on .em{transform:scale(1.14);filter:drop-shadow(0 5px 8px rgba(255,150,0,.35))}
.mood .hint{margin-top:10px}
.em-inline{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.16em}
.em-inline svg{width:100%;height:100%;display:block}
.fav-btn{display:grid;place-items:center;color:var(--muted)}
.fav-btn.on{color:#f5b301}
.del-btn{display:grid;place-items:center;color:var(--owe)}
header.top .icon-btn+.icon-btn{margin-left:-4px}
@media (max-width:359px){header.top{gap:8px}header.top .icon-btn{width:40px;height:40px}}
.btn.danger{background:#d93b40;color:#fff}
.del-info{background:var(--field);border-radius:16px;padding:12px 14px;margin:0 0 12px;box-shadow:inset 0 0 0 1px var(--line)}
.del-info b{display:block;font:800 17px/1.25 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.del-info small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.del-warn{margin:0 4px 14px;font-size:14px;line-height:1.45;color:var(--muted)}
.del-actions{display:grid;gap:8px}
#toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:12px}
#toast .t-txt{flex:1;min-width:0}
#toast .t-act{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--sun);color:#16151c;font:800 14px var(--sans)}
.fav-mark{color:#f5b301}
header.top h1{min-width:0}
.liked{margin-top:14px}
.liked textarea{margin-top:2px}
.st{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--get-soft);color:var(--get)}.st.owe{background:var(--owe-soft);color:var(--owe)}.st.wait{background:var(--soft);color:var(--accent)}

<div class="app" id="app"></div>

<script>
const KEY="skinemsya.v1";
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){return {events:[]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.events))S=seed();
let view={event:null,tab:"exp"};
// сохранение; если браузер не дал сохранить (память заполнена, приватный режим) — предупреждаем
function toast(t,act,fn,ms){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent="";el.classList.toggle("has-act",!!act);
  if(act){const sp=document.createElement("span");sp.className="t-txt";sp.textContent=t;const b=document.createElement("button");b.type="button";b.className="t-act";b.textContent=act;
    b.onclick=()=>{clearTimeout(el._t);el.classList.remove("show","has-act");fn()};el.append(sp,b)}else el.textContent=t;
  el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show","has-act"),ms||6000)}
const save=(quiet)=>{if(!quiet)S.lastChange=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Не удалось сохранить изменения: браузер не даёт записать данные. Сохраните копию на главном экране.")}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=k=>{const neg=k<0,a=Math.abs(k),r=Math.floor(a/100),c=a%100;const rs=String(r).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00a0");return (neg?"-":"")+rs+","+String(c).padStart(2,"0")};
const rub=k=>num(k)+"\u00a0₽";
// для чата: целые суммы без ",00"
const rubShort=k=>(Math.abs(k)%100?num(k):num(k).slice(0,-3))+"\u00a0₽";
const kop=v=>Math.round((parseFloat(String(v).replace(",","."))||0)*100);
const MAXK=1e11;const okAmt=v=>{const k=kop(v);return k>0&&k<MAXK};
const nameOf=(e,id)=>(e.people.find(p=>p.id===id)||{name:"—"}).name;

// на кого делится расход: список id или все участники
const CATS=[["food","Продукты"],["alco","Алкоголь"],["transport","Транспорт"],["home","Жильё"],["rest","Ресторан"],["banya","Баня"],["tour","Экскурсии"],["fun","Развлечения"],["group","Совместные закупки"],["extra","Допы"]];
const catName=k=>(CATS.find(c=>c[0]===k)||[,""])[1];
// суммы по категориям; без категории — отдельной строкой, если есть
// категории расхода: новый формат cats[], старый cat
function catsOf(x){const a=Array.isArray(x.cats)?x.cats:(x.cat?[x.cat]:[]);return [...new Set(a.filter(k=>catName(k)))]}
const catsLabel=x=>catsOf(x).map(catName).join(", ");
// как сумма расхода делится по категориям (в копейках): вручную, если суммы заданы и сходятся, иначе поровну
function catSplit(x){const a=kop(x.amount),ks=catsOf(x);if(!ks.length)return {"":a};if(ks.length===1)return {[ks[0]]:a};
  const m=x.catAmounts;if(m&&ks.every(k=>m[k]!=null)){const v=ks.map(k=>kop(m[k]));if(v.reduce((t,y)=>t+y,0)===a){const o={};ks.forEach((k,i)=>o[k]=v[i]);return o}}
  const base=Math.floor(a/ks.length),rem=a-base*ks.length,o={};ks.forEach((k,i)=>o[k]=base+(i<rem?1:0));return o}
const isManual=x=>{const ks=catsOf(x);if(ks.length<2||!x.catAmounts)return false;return ks.every(k=>x.catAmounts[k]!=null)&&ks.reduce((t,k)=>t+kop(x.catAmounts[k]),0)===kop(x.amount)};
// кто сколько заплатил в категории (с учётом деления расхода между категориями)
function catPayers(e,k){const m={};e.expenses.forEach(x=>{const v=catSplit(x)[k];if(!v)return;const ps=payersOf(e,x),a=kop(x.amount)||1;let used=0;
  ps.forEach((p,i)=>{const part=i===ps.length-1?v-used:Math.round(v*p.a/a);used+=part;m[p.id]=(m[p.id]||0)+part})});
  return Object.entries(m).map(([id,a])=>({id,a,name:nameOf(e,id)})).sort((a,b)=>b.a-a.a)}
function catTotals(e){const m={};e.expenses.forEach(x=>{Object.entries(catSplit(x)).forEach(([k,v])=>m[k]=(m[k]||0)+v)});
  const rows=CATS.filter(c=>m[c[0]]).map(c=>({k:c[0],n:c[1],a:m[c[0]]}));if(m[""])rows.push({k:"",n:"Без категории",a:m[""]});
  return {rows,any:CATS.some(c=>m[c[0]])}}
// кружок с первой буквой; цвет стабилен для имени
function ava(name,extra){const n=String(name||"?").trim();let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;
  return `<span class="ava c${h%6}${extra?" "+extra:""}" aria-hidden="true">${esc(n.charAt(0)||"?")}</span>`}
const pct=v=>(Math.round(v*10)/10).toString().replace(".",",")+"%";
function daysOf(e){if(!e.date)return 0;const a=new Date(e.date+"T00:00:00Z"),b=new Date((e.dateTo||e.date)+"T00:00:00Z");const d=Math.round((b-a)/864e5)+1;return isFinite(d)?Math.max(1,d):0}
function catFact(e){const m={};e.expenses.forEach(x=>{Object.entries(catSplit(x)).forEach(([k,v])=>m[k]=(m[k]||0)+v)});return m}
// разница план−факт: плюс = сэкономили
function planDelta(plan,fact){const d=plan-fact;return {d,p:plan?Math.abs(d)*100/plan:0,cls:d>=0?"good":"bad",word:d>=0?"Сэкономили":"Перерасход"}}
function wordsOf(n){return String(n||"").toLowerCase().split(/[^a-zа-яё]+/).filter(w=>w.length>=3).map(w=>w.slice(0,5))}
// похожие мероприятия: общие слова в названии, затем более свежие
function similarEvents(e){const w=new Set(wordsOf(e.name));
  return S.events.filter(x=>x.id!==e.id).map(x=>({x,score:wordsOf(x.name).filter(t=>w.has(t)).length}))
    .sort((a,b)=>b.score-a.score||(b.x.date||"").localeCompare(a.x.date||""))}
// основные категории на виду, остальные под «Ещё»
const MAIN_CATS=["","food","alco","transport","home","rest"];
function catChips(name,sel){
  sel=Array.isArray(sel)?sel.filter(k=>catName(k)):[];
  const all=[["","Без категории"],...CATS],chip=([k,l])=>`<label class="pick"><input type="checkbox" name="${name}" value="${k}"${(k===""?!sel.length:sel.includes(k))?" checked":""}><span>${l}</span></label>`;
  const main=all.filter(c=>MAIN_CATS.includes(c[0])),rest=all.filter(c=>!MAIN_CATS.includes(c[0]));
  const open=view.catsOpen||rest.some(c=>sel.includes(c[0]));
  return `<div class="chips">${main.map(chip).join("")}<span class="more-cats" data-more="${name}"${open?"":" hidden"}>${rest.map(chip).join("")}</span><button type="button" class="more-btn" data-more-btn="${name}" aria-expanded="${open}">${open?"Свернуть":"Ещё +"+rest.length}</button></div>`;
}
// ---------- своё окно выбора (вместо системного списка)
const PICKERS={};
function pickerField(id,title,options,sel,placeholder){
  PICKERS[id]={title,options};
  const cur=options.find(o=>o.value===sel);
  const face=cur?`${cur.ava?ava(cur.label):""}<span class="pk-main"><span class="pk-label">${esc(cur.label)}</span>${cur.sub?`<span class="pk-sub">${esc(cur.sub)}</span>`:""}</span>`
    :`<span class="pk-main"><span class="pk-label pk-ph">${esc(placeholder||"Выберите")}</span></span>`;
  return `<input type="hidden" id="${id}" value="${esc(sel||"")}"><button type="button" class="picker" data-picker="${id}" aria-haspopup="dialog" aria-label="${esc(title)}">${face}<span class="pk-chev" aria-hidden="true"></span></button>`;
}
const peopleOpts=e=>e.people.map(p=>({value:p.id,label:p.name,ava:true}));
function openSheet(title,options,sel,onPick){
  closeSheet();
  const wrap=document.createElement("div");wrap.className="sheet-wrap";wrap.id="sheet";
  wrap.innerHTML=`<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab" aria-hidden="true"></div><h3>${esc(title)}</h3>
    <div class="sheet-list">${options.map((o,i)=>`<button type="button" class="sheet-row${o.value===sel?" on":""}" data-i="${i}">${o.icon?`<span class="sh-ico">${o.icon}</span>`:o.ava?ava(o.label):""}<span class="pk-main"><span class="pk-label">${esc(o.label)}${o.star?' <span class="star">★</span>':""}</span>${o.sub?`<span class="pk-sub">${esc(o.sub)}</span>`:""}</span><span class="sh-check" aria-hidden="true"></span></button>`).join("")}</div>
    <button type="button" class="btn ghost sheet-close" data-close>Закрыть</button></div>`;
  document.body.appendChild(wrap);sheetOpened();
  requestAnimationFrame(()=>wrap.classList.add("open"));
  wrap.addEventListener("click",ev=>{const r=ev.target.closest(".sheet-row");if(r){const o=options[+r.dataset.i];closeSheet();onPick(o.value);return}
    if(ev.target.closest("[data-close]"))closeSheet()});
  const on=wrap.querySelector(".sheet-row.on")||wrap.querySelector(".sheet-row");if(on)on.focus({preventScroll:true});
}
// новый участник: доля и реквизиты берутся из образца, реквизиты — ещё и из прошлых мероприятий с тем же именем
function lastPayFor(name){const n=String(name).trim().toLowerCase();
  const evs=S.events.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  for(const ev of evs){if(ev.imported)continue;const p=ev.people.find(x=>x.name.trim().toLowerCase()===n&&x.pay);if(p)return p.pay}return ""}
function newPerson(name,tpl){const o={id:uid(),name};const t=tpl&&tpl.people.find(x=>x.name.trim().toLowerCase()===name.trim().toLowerCase());
  if(t&&wOf(t)!==1)o.w=t.w;const pay=(t&&t.pay)||lastPayFor(name);if(pay)o.pay=pay;return o}
// выбор конкретных мероприятий для фильтра «Показать»
function openPickSheet(setF){
  closeSheet();const sel=new Set((S.filter&&S.filter.ids)||[]);
  const list=S.events.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const wrap=document.createElement("div");wrap.className="sheet-wrap";wrap.id="sheet";
  wrap.innerHTML=`<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pkTitle"><div class="grab" aria-hidden="true"></div>
    <h3 id="pkTitle">Какие мероприятия показать</h3>
    ${list.length>6?'<input id="pkSearch" type="search" placeholder="Поиск по названию" style="margin-bottom:8px" autocomplete="off">':""}
    <div class="sheet-list" id="pkList">${list.map(e=>`<button type="button" class="sheet-row${sel.has(e.id)?" on":""}" data-id="${esc(e.id)}" aria-pressed="${sel.has(e.id)}"><span class="pk-main"><span class="pk-label">${e.fav?'<span class="star">★</span> ':""}${esc(e.name)}</span><span class="pk-sub">${esc([e.date?periodRu(e):"",rubShort(settle(e).total)].filter(Boolean).join(" · "))}</span></span><span class="sh-check" aria-hidden="true"></span></button>`).join("")}
      <p class="empty" id="pkNone" hidden>Ничего не найдено.</p></div>
    <div class="del-actions"><button type="button" class="btn" id="pkShow"></button><button type="button" class="btn ghost" id="pkClear">Снять все отметки</button></div></div>`;
  document.body.appendChild(wrap);sheetOpened();requestAnimationFrame(()=>wrap.classList.add("open"));
  const btn=wrap.querySelector("#pkShow"),upd=()=>{btn.textContent=sel.size?`Показать (${sel.size})`:"Показать все"};upd();
  wrap.addEventListener("click",ev=>{const r=ev.target.closest(".sheet-row");
    if(r){const id=r.dataset.id;if(sel.has(id))sel.delete(id);else sel.add(id);r.classList.toggle("on",sel.has(id));r.setAttribute("aria-pressed",sel.has(id));upd();return}
    if(ev.target.closest("[data-close]"))closeSheet()});
  wrap.querySelector("#pkClear").onclick=()=>{sel.clear();wrap.querySelectorAll(".sheet-row.on").forEach(r=>{r.classList.remove("on");r.setAttribute("aria-pressed","false")});upd()};
  btn.onclick=()=>{closeSheet();setF(sel.size?{mode:"pick",ids:[...sel]}:{mode:"all",ids:[]})};
  const q=wrap.querySelector("#pkSearch");if(q)q.oninput=()=>{const t=q.value.trim().toLowerCase();let n=0;

  const f=S.filter||{mode:"all",from:"",to:""};
  const shown=filterEvents(S.events,f).sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  ${backupNag()}
  <section class="card party"><span class="confetti" aria-hidden="true"></span><h2 class="party-title">Новая тусовка <span class="party-em">🎉</span></h2><form class="form" id="newEvent">
    <input id="evName" maxlength="80" placeholder="Название, например «Алтай, август»" required>
    <div class="dates"><label>с<input id="evFrom" type="date" value="${today}"></label><label>по<input id="evTo" type="date"></label></div>
    <p class="hint">Дата «по» нужна, если мероприятие длилось несколько дней.</p>
    <input id="evPeople" placeholder="Участники через запятую" value="${tplE?esc(tplE.people.map(p=>p.name).join(", ")):""}">
    ${S.events.some(x=>x.people.length)?(tplE?`<p class="hint tpl-note">По образцу «${esc(tplE.name)}»: доли и реквизиты участников${Object.keys(tplE.planCats||{}).length?", план по категориям":""} перенесутся. <button type="button" class="link tpl-link" id="tplClear">Убрать</button></p>`:'<button type="button" class="link tpl-link" id="tplPick">+ Участники из прошлого мероприятия</button>'):""}
    <input id="evPlan" type="number" inputmode="decimal" min="0" step="1" placeholder="Бюджет, ₽ (необязательно)" value="${tplE&&tplE.plan?esc(tplE.plan):""}">
    <details class="plan-edit desc-add"><summary>Добавить описание</summary><textarea id="evDesc" class="desc-input" rows="3" maxlength="2000" placeholder="Место, маршрут, что взять с собой, договорённости"></textarea></details>
    <button class="btn">Погнали</button></form></section>
  ${S.events.length?`<section class="card" id="historyBlock"><h2>Показать</h2>
    <div class="chips">${modes.map(([k,l])=>`<label class="pick"><input type="radio" name="fmode" value="${k}"${f.mode===k?" checked":""}><span>${l}</span></label>`).join("")}</div>
    ${f.mode==="range"?`<div class="dates" style="margin-top:10px"><label>с<input id="fFrom" type="date" value="${esc(f.from)}"></label><label>по<input id="fTo" type="date" value="${esc(f.to)}"></label></div>`:""}
    ${f.mode==="pick"?`<div class="pick-sum"><span>${shown.length?shown.map(e=>"«"+esc(e.name)+"»").join(", "):"Мероприятия не выбраны"}</span><button type="button" class="link acc" id="pickEdit">${shown.length?"Изменить":"Выбрать"}</button></div>`:""}
    <p class="hint" style="margin-top:10px">${f.mode==="pick"?(shown.length?`Выбрано: ${shown.length} · потрачено ${rubShort(sumAll)}`:"Нажмите «Выбрать» и отметьте нужные мероприятия."):f.mode==="fav"?(shown.length?`В избранном: ${shown.length} · потрачено ${rubShort(sumAll)}`:"В избранном пока пусто. Откройте мероприятие и нажмите звёздочку вверху."):f.mode==="all"?`Всего мероприятий: ${S.events.length}`:`Найдено ${shown.length} из ${S.events.length} · потрачено ${rubShort(sumAll)}`}</p></section>`:""}
  ${statsCard(shown)}
  ${list||(S.events.length?'<p class="empty">За этот период мероприятий нет.</p>':'<p class="empty">Пока пусто. Создайте первое мероприятие: поездку, встречу или совместную закупку.</p><button type="button" class="first-help" id="firstHelp">Впервые здесь? <b>Как пользоваться за 1 минуту →</b></button>')}
  <section class="card"><h2>Резервная копия</h2>
    ${offlineReady()?'<p class="hint ok" style="margin:0 0 8px">Приложение сохранено на телефоне и открывается без интернета.</p>':""}<p class="empty" style="margin-top:0">Данные хранятся только на этом устройстве. Сохраните копию в «Файлы» или отправьте себе в мессенджер, чтобы не потерять их.${S.lastBackup?` Последняя копия: ${new Date(S.lastBackup).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}.`:""}</p>
    <div class="row-actions"><button class="btn" id="exportBtn">Сохранить копию</button><button class="btn ghost" id="importBtn">Загрузить из копии</button></div>

    </div>
    <p class="empty" id="backupMsg" hidden></p>
    <textarea id="backupText" readonly hidden></textarea>
  </section>`;
}

function eventView(e){

    <section class="card" id="expCard"><h2>${ed?"Изменить расход":"Добавить расход"}</h2>${e.people.length?`<form class="form" id="addExp">
      <div class="two" id="singlePay">${pickerField("expPayer","Кто платил",peopleOpts(e),ed?ed.payer:e.people[0].id)}<input id="expAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Сумма" required value="${ed?esc(ed.amount):""}"></div>
      ${e.people.length>1?`<button type="button" class="link acc" id="multiToggle">${ed&&payersOf(e,ed).length>1?"Платил один человек":"Платили несколько человек"}</button>
      <div class="catsplit" id="multiPay" hidden><p class="hint">Сколько заплатил каждый. Пустые строки не учитываются.</p>
        ${e.people.map(p=>{const v=ed?(payersOf(e,ed).length>1?(ed.payers.find(q=>q.id===p.id)||{}).amount:""):"";return `<label class="ca-row"><span>${esc(p.name)}</span><input data-pay="${esc(p.id)}" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" value="${v?esc(v):""}"></label>`}).join("")}
        <div class="ca-row"><span>Итого</span><b id="multiSum">0 ₽</b></div><p class="err" id="multiErr" hidden>Укажите сумму хотя бы у одного человека.</p></div>`:""}
      <div class="split-head"><span>Категории · можно несколько</span></div>

      <input id="expNote" maxlength="300" placeholder="За что (необязательно)" value="${ed?esc(ed.note):""}">

      <p class="err" id="splitErr" hidden>Отметьте хотя бы одного человека.</p>
      <div class="row-actions"><button class="btn">${ed?"Сохранить":"Добавить"}</button>${ed?'<button type="button" class="btn ghost" id="cancelEdit">Отмена</button>':""}</div></form>`:'<p class="empty">Сначала добавьте участников.</p>'}</section>
    ${e.expenses.length?'<button type="button" class="btn to-sum" id="toSum">Итог →</button>':""}`;

      ${e.people.length?'<p class="hint" style="margin-top:10px">Нажмите на имя, чтобы указать долю (пара, ребёнок) и реквизиты для перевода.</p>':""}
      <p class="err" id="pDelMsg" hidden style="margin-top:10px"></p><form class="form" id="addP" style="margin-top:12px"><div class="two" style="grid-template-columns:1fr auto"><input id="pName" placeholder="Имя, можно несколько через запятую" required><button class="btn">+</button></div></form></section>
      <section class="card"><h2>Мероприятие</h2><form class="form" id="editEv"><input id="evRename" maxlength="80" value="${esc(e.name)}" aria-label="Название"><label class="lbl">Описание<textarea id="evDescEdit" class="desc-input" rows="4" maxlength="2000" placeholder="Место, маршрут, что взять с собой, договорённости">${esc(e.desc||"")}</textarea></label><div class="dates"><label>с<input id="evDate" type="date" value="${esc(e.date)}"></label><label>по<input id="evDateTo" type="date" value="${esc(e.dateTo||"")}"></label></div><div class="row-actions"><button class="btn ghost small">Сохранить</button><button type="button" class="link danger" id="delEv">Удалить мероприятие</button></div></form>

    <section class="card"><h2>Уже переведено</h2>${e.transfers.length?e.transfers.map(x=>`<div class="item">${ava(nameOf(e,x.from))}<div class="main">${esc(nameOf(e,x.from))}<small><span class="arrow">→</span> ${esc(nameOf(e,x.to))}</small></div><span class="sum">${rub(kop(x.amount))}</span><button class="link danger" data-del-tr="${esc(x.id)}" aria-label="Удалить">×</button></div>`).join(""):'<p class="empty">Переводов пока нет.</p>'}</section>`;
  }else{
    body=`${planCard(e,s)}
    ${(()=>{const ct=catTotals(e);if(!ct.any)return "";const mx=Math.max(...ct.rows.map(r=>r.a));
      return `<section class="card"><h2>По категориям</h2>${ct.rows.map(r=>{const ps=catPayers(e,r.k);
        return `<details class="catrow" data-cat="${r.k}"${(view.catOpen||[]).includes(r.k)?" open":""}><summary><div class="catline"><span><i class="cat-chev" aria-hidden="true"></i>${r.n}</span><span class="sum">${rubShort(r.a)} <small>${Math.round(r.a*100/s.total)}%</small></span></div><div class="bar"><i style="width:${Math.max(2,r.a*100/mx)}%"></i></div></summary>
          <div class="cat-payers">${ps.map(x=>`<div class="cp-row">${ava(x.name)}<span class="cp-name">${esc(x.name)}</span><span class="cp-bar"><i style="width:${Math.max(3,x.a*100/ps[0].a)}%"></i></span><span class="sum">${rubShort(x.a)}</span></div>`).join("")}</div></details>`}).join("")}
        <p class="hint" style="margin-top:6px">Нажмите на категорию, чтобы увидеть, кто платил.</p></section>`})()}
    ${perPerson(e,s)?`<section class="card pp"><span>${perPerson(e,s).label}</span><b>${perPerson(e,s).text}</b>${perPerson(e,s).uneven?`<small>${hasWeights(e)?"У части участников доля больше или меньше одной":"Часть расходов делилась не на всех"}, поэтому личные суммы разные. Точные суммы в балансе ниже.</small>`:""}</section>`:""}
    <section class="card"><h2>Баланс каждого</h2>${e.people.map((p,i)=>{const b=s.bal[i],st=Math.abs(b)<tolOf(e)?'<span class="st ok">рассчитался ✓</span>':b<0?`<span class="st owe">должен ${rubShort(-b)}</span>`:`<span class="st wait">ждёт ${rubShort(b)}</span>`;
      return `<div class="item">${ava(p.name)}<div class="main">${esc(p.name)}${wOf(p)!==1?` <span class="tag">доля ×${wLabel(wOf(p))}</span>`:""}<small>${st}</small></div><span class="sum ${b>0?"p":b<0?"n":""}">${b>0?"+":""}${rub(b)}</span></div>`}).join("")}

<section class="card" id="leftCard"><h2>Осталось перевести</h2>

      ${roundStep(e)?`<p class="hint" style="margin-top:6px">Переводы округлены до ${e.round} ₽. Разница до ${e.round/2} ₽ на человека не учитывается.</p>`:""}`:""}

      <p class="hint" id="linkMsg" hidden style="margin-top:8px"></p>

    </section>
    ${compareCard(e,s)}
    ${moodCard(e)}`;
  }
  const tabs=[["exp","Расходы"],["mine","Мои"],["ppl","Люди"],["tr","Переводы"],["sum","Итог"]].map(([k,l])=>`<button role="tab" aria-selected="${t===k}" data-tab="${k}"${k==="sum"?' class="tab-sum"':k==="mine"?' class="tab-mine"':""}>${l}</button>`).join("");

function periodRu(e){

  const [y1,m1,d1]=a.split("-").map(Number);if(!b)return `${d1} ${MONTHS[m1-1]} ${y1}`;

  if(y1===y2&&m1===m2)return `${d1}–${d2} ${MONTHS[m1-1]} ${y1}`;
  if(y1===y2)return `${d1} ${MONTHS[m1-1]} – ${d2} ${MONTHS[m2-1]} ${y1}`;

}

function pushMine(e){

  if($("shareLink"))$("shareLink").onclick=async()=>{const m=$("linkMsg");try{const url=await eventLink(e);
      m.textContent=url.length>4000?`Ссылка длинная (${url.length} символов). В Telegram может не поместиться в одно сообщение. Для больших мероприятий надёжнее «Сохранить копию» на главном экране.`:"Получатель откроет ссылку и сможет добавить мероприятие к себе.";m.hidden=false;

  if($("csvBtn"))$("csvBtn").onclick=()=>saveFile(`skinemsya-${safeFile(e.name)}.csv`,"\ufeff"+eventCSV(e),"text/csv",e.name).then(t=>{const m=$("linkMsg");if(m&&t){m.textContent=t;m.hidden=false}});
  on("[data-paid]",ev=>{const p=settle(e).plan[+ev.currentTarget.dataset.paid];if(p){e.transfers.push({id:uid(),from:p.from,to:p.to,amount:(p.a/100).toFixed(2)});commit()}});
  on("[data-more-btn]",ev=>{const b=ev.currentTarget,box=document.querySelector(`[data-more="${b.dataset.moreBtn}"]`);const open=box.hidden;

  if($("favBtn"))$("favBtn").onclick=()=>{e.fav=!e.fav;commit()};
  [["likedInput","liked"],["dislikedInput","disliked"]].forEach(([id,key])=>{const el=$(id);if(!el)return;let t;el.addEventListener("input",ev=>{e[key]=ev.target.value.trim();clearTimeout(t);t=setTimeout(()=>{save();
    const m=$("likedSaved");if(m){m.hidden=false;setTimeout(()=>{if(m)m.hidden=true},1500)}const pv=$("textPreview");if(pv)pv.textContent=summaryText(e)},400)})});
  document.querySelectorAll("details.catrow").forEach(d=>d.addEventListener("toggle",()=>{const k=d.dataset.cat,set=new Set(view.catOpen||[]);if(d.open)set.add(k);else set.delete(k);view.catOpen=[...set]}));
  if($("toSum"))$("toSum").onclick=()=>{view.tab="sum";view.edit=null;render();window.scrollTo({top:0,behavior:"smooth"})};
  if($("toMood"))$("toMood").onclick=()=>{const m=document.querySelector(".mood");if(m)m.scrollIntoView({behavior:"smooth",block:"start"})};
  on("[data-mood]",ev=>{const k=ev.currentTarget.dataset.mood;e.mood=e.mood===k?"":k;commit()});
  if($("meSel"))$("meSel").onchange=ev=>{e.me=ev.target.value||"";commit()};
  if($("mineForm")){
    const getMineCats=bindCatChips("mcat",c=>{view.mineCats=c});
    $("mineForm").onsubmit=ev=>{ev.preventDefault();const a=$("mineAmount").value;if(!okAmt(a)){$("mineAmount").classList.add("invalid");return}
      (e.mine=e.mine||[]).push({id:uid(),amount:a,note:$("mineNote").value.trim(),cats:(()=>{const c=getMineCats();view.mineCats=[];return c})(),personal:$("minePersonal").checked,pushed:false,ts:Date.now()});
      commit();const f=document.getElementById("mineAmount");if(f)f.focus()};
  }
  if($("minePush"))$("minePush").onclick=()=>{const sum=pushMine(e);save();render();const m=document.getElementById("mineMsg");if(m&&sum){m.textContent=`Перенесено в общие расходы: ${rubShort(sum)}.`;m.hidden=false}};
  if($("mineBack"))$("mineBack").onclick=()=>{const b=$("mineBack");
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Да, вернуть в журнал";$("mineBackHint").hidden=false;return}
    const sum=unpushMine(e);save();render();const m=document.getElementById("mineMsg");if(m&&sum){m.textContent=`Возвращено в журнал: ${rubShort(sum)}.`;m.hidden=false}};
  on("[data-del-mine]",ev=>{e.mine=(e.mine||[]).filter(x=>x.id!==ev.currentTarget.dataset.delMine);commit()});
  if($("descMore"))$("descMore").onclick=()=>{const t=$("descText"),open=t.classList.toggle("clamp");$("descMore").textContent=open?"Показать полностью":"Свернуть"};

    if($("planClear"))$("planClear").onclick=()=>{e.plan="";e.planCats={};commit()}}

  const present=async(cv,ids,fname,title)=>{
    $(ids.out).src=cv.toDataURL("image/png");$(ids.box).hidden=false;

    $(ids.box).scrollIntoView({behavior:"smooth",block:"start"})};
  const safeName=n=>(n||"raschet").replace(/[^\wа-яё-]+/gi,"_");
  const makeImg=async dark=>present(await summaryImage(e,dark),{out:"imgOut",box:"imgBox",share:"shareImg",save:"saveImg"},`itog-${safeName(e.name)}.png`,e.name);
  const makeCmpImg=async dark=>{const {o}=compareTarget(e);if(!o)return;
    present(await compareImage(e,o,dark),{out:"cmpImgOut",box:"cmpImgBox",share:"cmpShareImg",save:"cmpSaveImg"},`sravnenie-${safeName(e.name)}.png`,e.name+" vs "+o.name)};
  if($("cmpImg")){$("cmpImg").onclick=()=>makeCmpImg(false);$("cmpImgDark").onclick=()=>makeCmpImg(true)}
  if($("makeImg")){$("makeImg").onclick=()=>makeImg(false);$("makeImgDark").onclick=()=>makeImg(true)}

// ---------- резервная копия ----------
const evWord=n=>n+" "+(n%10===1&&n%100!==11?"мероприятие":n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?"мероприятия":"мероприятий");
// приводим данные к безопасному виду: id только из букв/цифр, строки ограниченной длины, суммы ≥ 0, даты ГГГГ-ММ-ДД
function sanitizeState(st){
  const okId=v=>typeof v==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(v);
  const str=(v,n)=>String(v==null?"":v).slice(0,n);
  const amt=v=>{const n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)&&n>=0&&n<1e9?String(v).replace(",",".").slice(0,16):"0"};
  const date=v=>{if(typeof v!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(v))return "";const d=new Date(v+"T00:00:00Z");return !isNaN(d)&&d.toISOString().slice(0,10)===v?v:""};
  const catKeys=new Set(CATS.map(c=>c[0])),moodKeys=new Set(MOODS.map(m=>m[0]));
  const events=[],seenEv=new Set();
  (Array.isArray(st&&st.events)?st.events:[]).slice(0,500).forEach(e=>{
    if(!e||typeof e!=="object")return;
    let eid=okId(e.id)&&!seenEv.has(e.id)?e.id:uid();seenEv.add(eid);
    const map={},people=[];
    (Array.isArray(e.people)?e.people:[]).slice(0,200).forEach(p=>{if(!p)return;const nid=okId(p.id)&&!map[p.id]?p.id:uid();if(p.id!=null)map[p.id]=nid;const w=Number(p.w),pay=str(p.pay,80).trim();const o={id:nid,name:str(p.name,60).trim()||"Без имени"};if(W_OPTS.includes(w)&&w!==1)o.w=w;if(pay)o.pay=pay;people.push(o)});
    const pid=v=>map[v]||null;
    const cats=a=>(Array.isArray(a)?a:[]).filter(k=>catKeys.has(k));
    const catAm=o=>{if(!o||typeof o!=="object")return null;const r={};Object.keys(o).forEach(k=>{if(catKeys.has(k))r[k]=amt(o[k])});return Object.keys(r).length?r:null};
    const expenses=(Array.isArray(e.expenses)?e.expenses:[]).slice(0,5000).filter(x=>x&&pid(x.payer)).map(x=>{
      const c=cats(Array.isArray(x.cats)?x.cats:(x.cat?[x.cat]:[]));
      const among=Array.isArray(x.among)?x.among.map(pid).filter(Boolean):null;
      const pays=Array.isArray(x.payers)?x.payers.slice(0,200).filter(q=>q&&pid(q.id)).map(q=>({id:pid(q.id),amount:amt(q.amount)})):[];
      const o={id:okId(x.id)?x.id:uid(),payer:pid(x.payer),amount:amt(x.amount),cats:c,catAmounts:catAm(x.catAmounts),note:str(x.note,300),among:among&&among.length?among:null,fromMine:!!x.fromMine};
      if(pays.length>1)o.payers=pays;return o});
    const expIds=new Set(expenses.map(x=>x.id));
    const transfers=(Array.isArray(e.transfers)?e.transfers:[]).slice(0,5000).filter(t=>t&&pid(t.from)&&pid(t.to)&&pid(t.from)!==pid(t.to))
      .map(t=>({id:okId(t.id)?t.id:uid(),from:pid(t.from),to:pid(t.to),amount:amt(t.amount)}));
    const mine=(Array.isArray(e.mine)?e.mine:[]).slice(0,5000).filter(Boolean).map(x=>{const pushedTo=okId(x.pushedTo)&&expIds.has(x.pushedTo)?x.pushedTo:undefined;
      const o={id:okId(x.id)?x.id:uid(),amount:amt(x.amount),note:str(x.note,120),cats:cats(Array.isArray(x.cats)?x.cats:(x.cat?[x.cat]:[])),personal:!!x.personal,pushed:!!x.pushed,ts:Number(x.ts)||Date.now()};
      if(pushedTo)o.pushedTo=pushedTo;return o});
    const planCats={};if(e.planCats&&typeof e.planCats==="object")Object.keys(e.planCats).forEach(k=>{if(catKeys.has(k))planCats[k]=amt(e.planCats[k])});
    events.push({id:eid,name:str(e.name,80).trim()||"Без названия",date:date(e.date),dateTo:date(e.dateTo),people,expenses,transfers,mine,
      me:pid(e.me)||"",plan:e.plan?amt(e.plan):"",planCats,desc:str(e.desc,2000),liked:str(e.liked,500),disliked:str(e.disliked,500),
      mood:moodKeys.has(e.mood)?e.mood:"",fav:!!e.fav,imported:!!e.imported,round:e.round===10||e.round===100?e.round:0,compareWith:okId(e.compareWith)||e.compareWith==="none"?e.compareWith:""});
  });
  const f=st&&st.filter&&typeof st.filter==="object"?st.filter:{};
  return {events,filter:{mode:["all","fav","month","prev","year","range","pick"].includes(f.mode)?f.mode:"all",from:date(f.from),to:date(f.to),ids:Array.isArray(f.ids)?f.ids.filter(okId).slice(0,500):[]},
    lastBackup:typeof(st&&st.lastBackup)==="string"?st.lastBackup.slice(0,40):undefined,
    lastChange:Number(st&&st.lastChange)||0,backupSnooze:Number(st&&st.backupSnooze)||0};
}
function validBackup(d){return d&&Array.isArray(d.events)&&d.events.every(e=>e&&e.id&&Array.isArray(e.people)&&Array.isArray(e.expenses)&&Array.isArray(e.transfers))}
function bindBackup($){
  const msg=t=>{$("backupMsg").textContent=t;$("backupMsg").hidden=false};
  const stamp=()=>{S.lastBackup=new Date().toISOString();save(true);const n=document.querySelector(".nag");if(n)n.remove()};
  $("exportBtn").onclick=async()=>{
    const data=JSON.stringify({app:"skinemsya",version:1,saved:new Date().toISOString(),events:S.events},null,1);
    const fname=`skinemsya-${new Date().toISOString().slice(0,10)}.json`;
    // 1) страница внутри Claude
    try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
      if(dl){await dl.save({filename:fname,data});stamp();msg("Копия сохранена: "+fname);return}}catch(err){}
    // 2) меню «Поделиться» на телефоне: Файлы, Telegram, почта
    try{const file=new File([data],fname,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Скинемся: копия"});stamp();msg("Копия отправлена: "+fname);return}}
    catch(err){if(err&&err.name==="AbortError"){msg("Сохранение отменено.");return}}
    // 3) обычное скачивание
    try{const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);stamp();msg("Файл "+fname+" скачан. Если он не появился, скопируйте текст ниже и сохраните его в заметку.")}
    catch(err){msg("Не удалось сохранить файл. Скопируйте текст ниже и сохраните его в заметку.")}
    const ta=$("backupText");ta.value=data;ta.hidden=false;
  };
  let pending=null;
  $("importBtn").onclick=()=>{$("importFile").value="";$("importFile").click()};
  $("importFile").onchange=ev=>{const f=ev.target.files[0];if(!f)return;
    if(f.size>5*1024*1024){msg("Файл слишком большой для копии «Скинемся» (больше 5 МБ).");return}
    const r=new FileReader();
    r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(err){}
      if(!validBackup(d)){msg("Это не файл копии «Скинемся». Выберите файл skinemsya-….json.");return}
      pending=sanitizeState(d);const sv=d.saved?new Date(d.saved):null;$("importInfo").textContent=`В копии ${evWord(pending.events.length)}${sv&&!isNaN(sv)?", сохранена "+sv.toLocaleString("ru-RU"):""}. Как загрузить?`;
      $("importAsk").hidden=false;$("backupMsg").hidden=true};
    r.readAsText(f)};
  $("importCancel").onclick=()=>{pending=null;$("importAsk").hidden=true};
  $("importMerge").onclick=()=>{if(!pending)return;let added=0,upd=0;
    pending.events.forEach(ne=>{const i=S.events.findIndex(x=>x.id===ne.id);if(i<0||S.events[i].imported)ne.imported=true;if(i>=0){S.events[i]=ne;upd++}else{S.events.push(ne);added++}});
    pending=null;save();render();msgAfter(`Загружено: новых ${added}, обновлено ${upd}.`)};
  $("importReplace").onclick=()=>{if(!pending)return;
    if($("importReplace").dataset.armed!=="1"){$("importReplace").dataset.armed="1";$("importReplace").textContent="Точно заменить? Нажмите ещё раз";return}
    const n=pending.events.length;S.events=pending.events;pending=null;save();render();msgAfter(`Данные заменены: ${evWord(n)}.`)};
}
function msgAfter(t){const m=document.getElementById("backupMsg");if(m){m.textContent=t;m.hidden=false}}
// своя проверка пустых полей вместо системной подсказки браузера
document.addEventListener("submit",ev=>{const bad=[...ev.target.querySelectorAll("[required]")].find(i=>!String(i.value).trim());
  if(bad){ev.preventDefault();ev.stopImmediatePropagation();bad.classList.add("invalid");bad.placeholder=bad.placeholder.replace(/^Заполните: /,"");bad.placeholder="Заполните: "+bad.placeholder;bad.focus()}},true);
document.addEventListener("input",ev=>{if(ev.target.classList)ev.target.classList.remove("invalid")});
S=sanitizeState(S);
render();
checkLinkImport();
// офлайн-режим: только на настоящем сайте (не внутри Claude и не из файла)
try{if("serviceWorker" in navigator&&window.isSecureContext&&window.top===window&&location.protocol!=="file:")
  navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(err){}
